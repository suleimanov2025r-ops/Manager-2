function SaveModal({ save, onClose, actions }) {
  const [text, setText] = useState('');
  const [msg, setMsg] = useState('');
  const taRef = useRef(null);
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { window.removeEventListener('keydown', onKey); document.body.style.overflow = prev; };
  }, []);

  const exportText = async () => {
    const json = actions.exportJson();
    setText(json);
    try {
      await navigator.clipboard.writeText(json);
      setMsg('Сохранение скопировано. Вставьте его в заметки или файл.');
    } catch (e) {
      setMsg('Выделите текст ниже и скопируйте его вручную.');
      if (taRef.current) taRef.current.select();
    }
  };
  const importText = () => {
    const r = actions.importJson(text);
    setMsg(r.error ? r.error : 'Сохранение загружено.');
  };
  const loadCloud = async () => {
    const r = await actions.loadCloud();
    setMsg(r.error ? r.error : 'Облачное сохранение загружено.');
  };

  const statusText = {
    idle: 'Автосохранение включено',
    saving: 'Сохраняю…',
    saved: save.cloud ? 'Сохранено в браузере и в облаке' : 'Сохранено в браузере',
    local: 'Сохранено в браузере. Облако недоступно',
    error: 'Не удалось сохранить. Скопируйте сохранение вручную'
  }[save.status];

  return (
    <div className="modal-back" onClick={onClose} role="dialog" aria-modal="true" aria-label="Сохранение">
      <div className="modal-panel max-w-xl" onClick={(e) => e.stopPropagation()}>
        <div className="bg-navy text-navyink p-4 flex items-center justify-between gap-3">
          <h2 className="font-display text-2xl font-bold uppercase tracking-wider">Сохранение</h2>
          <button type="button" onClick={onClose} className="btn-navy rounded px-2.5 py-1 text-xs font-semibold transition-colors">Закрыть</button>
        </div>
        <div className="p-4 space-y-4">
          <div className="border border-line rounded bg-surf2 p-3 text-sm">
            <div className="font-semibold">{statusText}</div>
            <div className="text-mute text-xs mt-1">
              {save.ts ? `Последнее сохранение: ${new Date(save.ts).toLocaleString('ru-RU')}` : 'Изменений пока нет'}
            </div>
          </div>
          <p className="text-sm text-mute">
            Игра сохраняется сама после каждого действия и открывается в том же состоянии при следующем заходе. Когда страница открыта под вашим аккаунтом, копия лежит и в облаке.
          </p>
          <div className="flex flex-wrap gap-2">
            <button type="button" className={btn('primary')} onClick={actions.saveNow}>Сохранить сейчас</button>
            <ConfirmButton label="Загрузить из облака" confirmLabel="Заменить текущую игру" onConfirm={loadCloud} />
          </div>
          <div>
            <label className={labelCls} htmlFor="save-text">Перенос вручную</label>
            <textarea id="save-text" ref={taRef} rows={5} className={`${inputCls} font-mono text-xs`} placeholder="Здесь появится текст сохранения. Для загрузки вставьте его сюда." value={text} onChange={(e) => setText(e.target.value)} />
            <div className="flex flex-wrap gap-2 mt-2">
              <button type="button" className={btn('ghost')} onClick={exportText}>Копировать сохранение</button>
              <ConfirmButton label="Загрузить из текста" confirmLabel="Заменить текущую игру" onConfirm={importText} />
            </div>
          </div>
          {msg && <p className="text-sm font-semibold fade-in" role="status">{msg}</p>}
          <div className="pt-3 border-t border-line flex flex-wrap items-center justify-between gap-3">
            <span className="text-xs text-mute">Сброс вернёт пустую базу и 6 базовых турниров.</span>
            <ConfirmButton size="sm" label="Сбросить игру" confirmLabel="Стереть всё и сбросить" onConfirm={actions.reset} />
          </div>
        </div>
      </div>
    </div>
  );
}

const TABS = [
  ['clubs', 'Клубы'], ['national', 'Сборные'], ['transfers', 'Трансферы'],
  ['stats', 'Статистика'], ['ballon', 'Золотой мяч'], ['tournaments', 'Турниры'], ['manage', 'База']
];

function validatePlayer(data, ctx) {
  const n = String(data.name).trim();
  if (!n) return { error: 'Введите имя игрока' };
  if (!POSITIONS.includes(data.pos)) return { error: 'Выберите позицию' };
  const v = Number(data.ovr);
  if (data.ovr === '' || !Number.isInteger(v) || v < 40 || v > 99) return { error: 'OVR должен быть целым числом от 40 до 99' };
  let num;
  if (data.number !== undefined && data.number !== '' && data.number !== null) {
    const nn = Number(data.number);
    if (!Number.isInteger(nn) || nn < 1 || nn > 99) return { error: 'Номер должен быть от 1 до 99' };
    if (ctx.clubId && ctx.players.some((p) => p.clubId === ctx.clubId && p.id !== ctx.selfId && p.number === nn)) return { error: `Номер ${nn} уже занят в этом клубе` };
    num = nn;
  }
  let age = null;
  if (data.age !== undefined && data.age !== '' && data.age !== null) {
    const a = Number(data.age);
    if (!Number.isInteger(a) || a < 15 || a > 60) return { error: 'Возраст должен быть от 15 до 60' };
    age = a;
  }
  return { name: n, pos: data.pos, ovr: v, number: num, age };
}

function App() {
  const [db, setDb] = useState(null);
  const [loaded, setLoaded] = useState(false);

  useEffect(() => {
    loadLocal().then((saved) => {
      setDb(saved.db);
      setLoaded(true);
    });
  }, []);

  if (!loaded) return <div className="p-8 text-center font-bold">Загрузка игры...</div>;

  const dbRef = useRef(db);
  dbRef.current = db;
  const [route, setRoute] = useState({ tab: 'clubs', playerId: null, clubId: null });
  const routeRef = useRef(route);
  routeRef.current = route;
  const histRef = useRef([]);
  const [matchId, setMatchId] = useState(null);
  const [clubPickerPlayerId, setClubPickerPlayerId] = useState(null);
  const [saveOpen, setSaveOpen] = useState(false);
  const [toast, setToast] = useState(null);
  const [save, setSave] = useState({ status: 'idle', ts: 0, cloud: false });

  const localTsRef = useRef(0);
  const savingRef = useRef(false);
  const dirtyRef = useRef(false);
  const firstRef = useRef(true);

  const notify = (msg, kind) => setToast({ msg, kind: kind || 'ok', id: uid() });
  useEffect(() => {
    if (!toast) return undefined;
    const timer = setTimeout(() => setToast(null), 3200);
    return () => clearTimeout(timer);
  }, [toast]);

  const persistNow = () => {
    const ts = Date.now();
    const ok = saveLocal(dbRef.current, ts);
    localTsRef.current = ts;
    dirtyRef.current = false;
    setSave({ status: ok ? 'local' : 'error', ts, cloud: false });
    return ok;
  };

  useEffect(() => {
    if (firstRef.current) { firstRef.current = false; return undefined; }
    dirtyRef.current = true;
    setSave((s) => ({ ...s, status: 'saving' }));
    const timer = setTimeout(persistNow, 700);
    return () => clearTimeout(timer);
  }, [db]);

  useEffect(() => {
    const flush = () => { if (dirtyRef.current) { saveLocal(dbRef.current, Date.now()); dirtyRef.current = false; } };
    window.addEventListener('pagehide', flush);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
    return () => window.removeEventListener('pagehide', flush);
  }, []);

  const playerIds = useMemo(() => new Set(db.players.map((p) => p.id)), [db.players]);
  const clubIds = useMemo(() => new Set(db.clubs.map((c) => c.id)), [db.clubs]);
  const clubLogos = useMemo(() => { const m = {}; db.clubs.forEach((c) => { m[c.id] = c.logo || null; }); return m; }, [db.clubs]);
  const tourLogos = useMemo(() => { const m = {}; db.tournaments.forEach((t) => { m[t.id] = t.logo || null; }); return m; }, [db.tournaments]);
  const scrollTop = () => { try { window.scrollTo({ top: 0, behavior: 'smooth' }); } catch (e) { /* ignore */ } };
  const nav = {
    hasPlayer: (id) => playerIds.has(id),
    hasClub: (id) => clubIds.has(id),
    clubLogo: (id) => clubLogos[id] || null,
    tournamentLogo: (id) => tourLogos[id] || null,
    openPlayer: (id) => {
      if (!playerIds.has(id)) { notify('Игрок удалён из базы', 'bad'); return; }
      histRef.current.push(routeRef.current);
      setMatchId(null);
      setRoute((r) => ({ ...r, playerId: id }));
      scrollTop();
    },
    openClub: (id) => {
      if (!clubIds.has(id)) { notify('Клуб удалён из базы', 'bad'); return; }
      histRef.current.push(routeRef.current);
      setMatchId(null);
      setRoute({ tab: 'clubs', playerId: null, clubId: id });
      scrollTop();
    },
    openMatch: (id) => setMatchId(id),
    openClubPicker: (playerId) => setClubPickerPlayerId(playerId)
  };
  const back = () => {
    const prev = histRef.current.pop();
    setRoute(prev || { ...routeRef.current, playerId: null });
    scrollTop();
  };
  const selectTab = (tab) => {
    histRef.current = [];
    setRoute((r) => ({ tab, playerId: null, clubId: r.clubId }));
  };

  const act = {
    addClub: (name) => {
      const n = name.trim();
      if (!n) return { error: 'Введите название клуба' };
      if (dbRef.current.clubs.some((c) => c.name.toLowerCase() === n.toLowerCase())) return { error: 'Клуб с таким названием уже есть' };
      const club = { id: uid(), name: n };
      setDb((p) => ({ ...p, clubs: [...p.clubs, club] }));
      notify(`Клуб «${n}» создан`);
      return { id: club.id };
    },
    renameClub: (id, name) => {
      const n = name.trim();
      if (!n) return { error: 'Введите название клуба' };
      if (dbRef.current.clubs.some((c) => c.id !== id && c.name.toLowerCase() === n.toLowerCase())) return { error: 'Клуб с таким названием уже есть' };
      setDb((p) => ({ ...p, clubs: p.clubs.map((c) => (c.id === id ? { ...c, name: n } : c)) }));
      return {};
    },
    deleteClub: (id) => {
      const cur = dbRef.current;
      const hasActiveEdition = cur.tournaments.some((t) => t.editions.some((e) => e.status === 'active' && e.teams.some((tm) => tm.id === id)));
      if (hasActiveEdition) return { error: 'Клуб участвует в незавершённом розыгрыше. Завершите или удалите его.' };
      const club = cur.clubs.find((c) => c.id === id);
      setDb((p) => ({ ...p, clubs: p.clubs.filter((c) => c.id !== id), players: p.players.map((pl) => (pl.clubId === id ? { ...pl, clubId: null, number: null } : pl)) }));
      notify(`Клуб «${club ? club.name : ''}» удалён. Игроки стали свободными агентами`);
      return {};
    },
    addPlayer: (data) => {
      const cur = dbRef.current;
      const v = validatePlayer(data, { players: cur.players, clubId: data.clubId || null, selfId: null });
      if (v.error) return v;
      const num = v.number || (data.clubId ? nextNumber(cur.players, data.clubId) : null);
      const pl = makePlayer(data.clubId || null, v.name, v.pos, v.ovr, num, data.countryId || null, v.age);
      setDb((p) => ({ ...p, players: [...p.players, pl] }));
      return {};
    },
    updatePlayer: (id, data) => {
      const cur = dbRef.current;
      const pl = cur.players.find((x) => x.id === id);
      if (!pl) return { error: 'Игрок не найден' };
      const targetClub = data.clubId !== undefined ? data.clubId : pl.clubId;
      const v = validatePlayer(data, { players: cur.players, clubId: targetClub, selfId: id });
      if (v.error) return v;
      setDb((p) => ({
        ...p,
        players: p.players.map((x) => {
          if (x.id !== id) return x;
          const next = { ...x, name: v.name, pos: v.pos, ovr: v.ovr, age: v.age, countryId: data.countryId !== undefined ? data.countryId || null : x.countryId };
          if (targetClub !== x.clubId) {
            next.clubId = targetClub || null;
            const taken = p.players.some((other) => other.id !== id && other.clubId === targetClub && other.number === v.number);
            next.number = targetClub ? (v.number && !taken ? v.number : nextNumber(p.players.filter((o) => o.id !== id), targetClub)) : null;
          } else {
            next.number = v.number || x.number;
          }
          return next;
        })
      }));
      return {};
    },
    deletePlayer: (id) => {
      setDb((p) => ({ ...p, players: p.players.filter((x) => x.id !== id) }));
    },
    makeFreeAgent: (id) => {
      setDb((p) => ({ ...p, players: p.players.map((x) => (x.id === id ? { ...x, clubId: null, number: null } : x)) }));
      notify('Игрок стал свободным агентом');
    },
    retirePlayer: (id) => {
      setDb((p) => ({ ...p, players: p.players.map((x) => (x.id === id ? { ...x, retired: true, retiredAge: x.age, clubId: null, number: null } : x)) }));
      notify('Игрок завершил карьеру');
    },
    resumeCareer: (id) => {
      setDb((p) => ({ ...p, players: p.players.map((x) => (x.id === id ? { ...x, retired: false, age: x.retiredAge != null ? x.retiredAge : x.age, retiredAge: null } : x)) }));
      notify('Игрок вернулся в футбол. Он свободный агент');
    },
    transfer: (playerId, toId) => {
      const cur = dbRef.current;
      const pl = cur.players.find((x) => x.id === playerId);
      const to = cur.clubs.find((c) => c.id === toId);
      if (!pl || !to) return { error: 'Игрок или клуб не найден' };
      if (pl.retired) return { error: 'Игрок завершил карьеру' };
      const from = cur.clubs.find((c) => c.id === pl.clubId);
      const taken = cur.players.some((x) => x.id !== playerId && x.clubId === toId && x.number === pl.number);
      const number = !pl.number || taken ? nextNumber(cur.players.filter((x) => x.id !== playerId), toId) : pl.number;
      const entry = { id: uid(), playerId, playerName: pl.name, fromId: pl.clubId || null, fromName: from ? from.name : 'Свободный агент', toId, toName: to.name, season: cur.season, ts: Date.now() };
      setDb((p) => ({ ...p, players: p.players.map((x) => (x.id === playerId ? { ...x, clubId: toId, number } : x)), transfers: [entry, ...p.transfers] }));
      notify(`${pl.name} перешёл в «${to.name}»`);
      return {};
    },
    signFreeAgent: (playerId, clubId) => {
      const cur = dbRef.current;
      const pl = cur.players.find((x) => x.id === playerId);
      const to = cur.clubs.find((c) => c.id === clubId);
      if (!pl || !to) return { error: 'Игрок или клуб не найден' };
      if (pl.clubId) return { error: 'Игрок уже в клубе' };
      if (pl.retired) return { error: 'Игрок завершил карьеру' };
      const number = nextNumber(cur.players, clubId);
      const entry = { id: uid(), playerId, playerName: pl.name, fromId: null, fromName: 'Свободный агент', toId: clubId, toName: to.name, season: cur.season, ts: Date.now() };
      setDb((p) => ({ ...p, players: p.players.map((x) => (x.id === playerId ? { ...x, clubId, number } : x)), transfers: [entry, ...p.transfers] }));
      notify(`${pl.name} подписан в «${to.name}»`);
      return {};
    },
    addNationalTeam: (name) => {
      const n = name.trim();
      if (!n) return { error: 'Введите название сборной' };
      if (dbRef.current.nationalTeams.some((c) => c.name.toLowerCase() === n.toLowerCase())) return { error: 'Сборная с таким названием уже есть' };
      const team = { id: uid(), name: n, logo: null };
      setDb((p) => ({ ...p, nationalTeams: [...p.nationalTeams, team] }));
      notify(`Сборная «${n}» создана`);
      return { id: team.id };
    },
    deleteNationalTeam: (id) => {
      const cur = dbRef.current;
      const hasActive = cur.tournaments.some((t) => t.national && t.editions.some((e) => e.status === 'active' && e.teams.some((tm) => tm.id === id)));
      if (hasActive) return { error: 'Сборная участвует в активном розыгрыше' };
      setDb((p) => ({ ...p, nationalTeams: p.nationalTeams.filter((c) => c.id !== id), players: p.players.map((pl) => (pl.countryId === id ? { ...pl, countryId: null } : pl)) }));
      notify('Сборная удалена');
      return {};
    },
    setNationalTeamLogo: (id, logo) => {
      setDb((p) => ({ ...p, nationalTeams: p.nationalTeams.map((c) => (c.id === id ? { ...c, logo: logo || null } : c)) }));
    },
    setClubLogo: (id, logo) => {
      setDb((p) => ({ ...p, clubs: p.clubs.map((c) => (c.id === id ? { ...c, logo: logo || null } : c)) }));
    },
    setTournamentLogo: (id, logo) => {
      setDb((p) => ({ ...p, tournaments: p.tournaments.map((t) => (t.id === id ? { ...t, logo: logo || null } : t)) }));
    },
    updateSchedule: (tournamentId, editionId, fixtures) => {
      setDb((p) => ({
        ...p,
        tournaments: p.tournaments.map((t) => {
          if (t.id !== tournamentId) return t;
          return {
            ...t,
            editions: t.editions.map((e) => (e.id === editionId ? { ...e, fixtures } : e))
          };
        })
      }));
      notify('Расписание обновлено');
      return {};
    },
    createTournament: ({ name, type, clubIds: ids, logo, twoLegs, finalOneMatch, national }) => {
      const n = name.trim();
      if (!n) return { error: 'Введите название турнира' };
      if (ids.length < 2) return { error: 'Выберите минимум два участника' };
      const cur = dbRef.current;
      const pool = national ? cur.nationalTeams : cur.clubs;
      const empty = ids.map((id) => pool.find((c) => c.id === id)).filter((c) => c && (national ? !cur.players.some((p) => p.countryId === c.id && !p.retired) : !squadOf(cur.players, c.id).length));
      if (empty.length) return { error: `Нет игроков: ${empty.map((c) => c.name).join(', ')}` };
      const teams = ids.map((id) => { const c = pool.find((x) => x.id === id); return { id, name: c.name }; });
      const tid = uid();
      const editionId = uid();
      const base = { id: editionId, tournamentId: tid, tournamentName: n, tType: type, season: cur.season, teams, status: 'active', championId: null, national: !!national, twoLegs: !!twoLegs, finalOneMatch: finalOneMatch !== false };
      const edition = type === 'league' ? { ...base, fixtures: buildLeagueFixtures(ids) } : { ...base, rounds: buildCup(ids, !!twoLegs, finalOneMatch !== false), squads: {} };
      const tour = { id: tid, baseKey: null, name: n, type, twoLegs: !!twoLegs, finalOneMatch: finalOneMatch !== false, national: !!national, logo: logo || null, createdAt: Date.now(), editions: [edition] };
      setDb((p) => ({ ...p, tournaments: [tour, ...p.tournaments] }));
      notify(`Турнир «${n}» создан`);
      return { id: tid, editionId };
    },
    launchEdition: (tournamentId, ids) => {
      const cur = dbRef.current;
      const tour = cur.tournaments.find((t) => t.id === tournamentId);
      if (!tour) return { error: 'Турнир не найден' };
      if (tour.editions.some((e) => e.status === 'active')) return { error: 'Уже есть активный розыгрыш' };
      if (ids.length < 2) return { error: 'Выберите минимум два участника' };
      const pool = tour.national ? cur.nationalTeams : cur.clubs;
      const empty = ids.map((id) => pool.find((c) => c.id === id)).filter((c) => c && (tour.national ? !cur.players.some((p) => p.countryId === c.id && !p.retired) : !squadOf(cur.players, c.id).length));
      if (empty.length) return { error: `Нет игроков: ${empty.map((c) => c.name).join(', ')}` };
      const teams = ids.map((id) => { const c = pool.find((x) => x.id === id); return { id, name: c.name }; });
      const editionId = uid();
      const base = { id: editionId, tournamentId: tour.id, tournamentName: tour.name, tType: tour.type, season: cur.season, teams, status: 'active', championId: null, national: !!tour.national, twoLegs: !!tour.twoLegs, finalOneMatch: tour.finalOneMatch !== false };
      const edition = tour.type === 'league' ? { ...base, fixtures: buildLeagueFixtures(ids) } : { ...base, rounds: buildCup(ids, !!tour.twoLegs, tour.finalOneMatch !== false), squads: {} };
      setDb((p) => ({ ...p, tournaments: p.tournaments.map((t) => (t.id === tournamentId ? { ...t, editions: [edition, ...t.editions] } : t)) }));
      notify(`Розыгрыш ${cur.season} запущен`);
      return { editionId };
    },
    deleteEdition: (tournamentId, editionId) => {
      const cur = dbRef.current;
      const tour = cur.tournaments.find((t) => t.id === tournamentId);
      if (!tour) return { error: 'Турнир не найден' };
      const edition = tour.editions.find((e) => e.id === editionId);
      if (!edition) return { error: 'Розыгрыш не найден' };
      const keepMatches = cur.matches.filter((m) => m.editionId ? m.editionId !== editionId : !(m.tournamentId === tournamentId && m.season === edition.season));
      const keepHonours = cur.honours.filter((h) => h.editionId !== editionId);
      const players = recomputePlayerStats(cur.players, keepMatches);
      setDb((p) => ({ ...p, matches: keepMatches, honours: keepHonours, players, tournaments: p.tournaments.map((t) => (t.id === tournamentId ? { ...t, editions: t.editions.filter((e) => e.id !== editionId) } : t)) }));
      notify('Розыгрыш удалён вместе со статистикой');
      return {};
    },
    deleteTournament: (id) => {
      const cur = dbRef.current;
      const tour = cur.tournaments.find((t) => t.id === id);
      if (!tour) return { error: 'Турнир не найден' };
      const keepMatches = cur.matches.filter((m) => m.tournamentId !== id);
      const keepHonours = cur.honours.filter((h) => h.tournamentId !== id);
      const players = recomputePlayerStats(cur.players, keepMatches);
      setDb((p) => ({ ...p, matches: keepMatches, honours: keepHonours, players, tournaments: p.tournaments.filter((t) => t.id !== id) }));
      notify('Турнир удалён со всей историей');
      return {};
    },
    toggleWcSquad: (tournamentId, editionId, countryId, playerId) => {
      setDb((p) => ({
        ...p,
        tournaments: p.tournaments.map((t) => {
          if (t.id !== tournamentId) return t;
          return { ...t, editions: t.editions.map((e) => {
            if (e.id !== editionId) return e;
            const squads = { ...(e.squads || {}) };
            const list = squads[countryId] ? [...squads[countryId]] : [];
            const idx = list.indexOf(playerId);
            if (idx >= 0) list.splice(idx, 1); else list.push(playerId);
            squads[countryId] = list;
            return { ...e, squads };
          }) };
        })
      }));
    },
    simulateEdition: (tournamentId, editionId, mode, arg) => {
      const res = simulateEdition(dbRef.current, tournamentId, editionId, mode, arg);
      if (res.error) { notify(res.error, 'bad'); return; }
      setDb(res.db);
      notify(`Сыграно матчей: ${res.count}`);
    },
    saveManualMatch: (tournamentId, editionId, fixtureId, newMatch) => {
      setDb(p => {
        const cur = p;
        const newMatches = [...cur.matches, newMatch];
        const players = recomputePlayerStats(cur.players, newMatches);
        return {
          ...p,
          matches: newMatches,
          players,
          tournaments: p.tournaments.map(t => {
            if (t.id !== tournamentId) return t;
            return {
              ...t,
              editions: t.editions.map(e => {
                if (e.id !== editionId) return e;
                return {
                  ...e,
                  fixtures: e.fixtures.map(f => f.id === fixtureId ? { ...f, played: true, hg: newMatch.hg, ag: newMatch.ag, matchId: newMatch.id, events: newMatch.events } : f)
                };
              })
            };
          })
        };
      });
    },
    saveManualCupMatch: (tournamentId, editionId, tieId, legStr, newMatch) => {
      setDb(p => {
        const cur = p;
        const newMatches = [...cur.matches, newMatch];
        const players = recomputePlayerStats(cur.players, newMatches);
        return {
          ...p,
          matches: newMatches,
          players,
          tournaments: p.tournaments.map(t => {
            if (t.id !== tournamentId) return t;
            return {
              ...t,
              editions: t.editions.map(e => {
                if (e.id !== editionId) return e;
                const rs = e.rounds.map(r => r.map(tie => {
                   if (tie.id !== tieId) return tie;
                   const legObj = { hg: newMatch.hg, ag: newMatch.ag, pens: newMatch.pens, winner: newMatch.winner, events: newMatch.events, matchId: newMatch.id, played: true };
                   if (legStr === 'single') return { ...tie, single: legObj, played: true, winner: newMatch.winner };
                   const updatedTie = { ...tie, [legStr]: legObj };
                   if (updatedTie.leg1 && updatedTie.leg2) {
                     updatedTie.played = true;
                     updatedTie.homeAgg = updatedTie.leg1.hg + updatedTie.leg2.ag;
                     updatedTie.awayAgg = updatedTie.leg1.ag + updatedTie.leg2.hg;
                     if (updatedTie.homeAgg === updatedTie.awayAgg) {
                       updatedTie.winner = Math.random() > 0.5 ? updatedTie.home : updatedTie.away;
                       updatedTie.pens = { h: updatedTie.homeAgg, a: updatedTie.awayAgg };
                     } else {
                       updatedTie.winner = updatedTie.homeAgg > updatedTie.awayAgg ? updatedTie.home : updatedTie.away;
                     }
                   }
                   return updatedTie;
                }));
                return { ...e, rounds: resolveCup(rs, t.twoLegs, t.finalOneMatch) };
              })
            };
          })
        };
      });
    },
    editMatch: (matchId, data) => {
      const cur = dbRef.current;
      const m = cur.matches.find((x) => x.id === matchId);
      if (!m) return { error: 'Матч не найден' };
      const goalCounts = {};
      data.events.forEach((e) => { goalCounts[e.playerId] = (goalCounts[e.playerId] || 0) + 1; });
      const updateLineup = (list) => list.map((e) => ({ ...e, goals: goalCounts[e.id] || 0 }));
      const updated = { ...m, hg: clamp(Number(data.hg) || 0, 0, 30), ag: clamp(Number(data.ag) || 0, 0, 30), motmId: data.motmId || null, events: data.events, lineups: { home: updateLineup(m.lineups.home), away: updateLineup(m.lineups.away) } };
      const homeGoals = updated.lineups.home.reduce((s, e) => s + e.goals, 0);
      const awayGoals = updated.lineups.away.reduce((s, e) => s + e.goals, 0);
      if (homeGoals !== updated.hg || awayGoals !== updated.ag) {
        return { error: `Сумма голов в событиях не совпадает со счётом. Хозяева: ${homeGoals}/${updated.hg}, гости: ${awayGoals}/${updated.ag}. Добавьте или удалите голы.` };
      }
      const newMatches = cur.matches.map((x) => (x.id === matchId ? updated : x));
      
      const newTournaments = cur.tournaments.map(t => ({
        ...t,
        editions: t.editions.map(e => {
          if (e.fixtures) {
            return { ...e, fixtures: e.fixtures.map(f => f.matchId === matchId ? { ...f, hg: updated.hg, ag: updated.ag } : f) };
          }
          if (e.rounds) {
            const rs = e.rounds.map(r => r.map(tie => {
               const isSingle = tie.single && tie.single.matchId === matchId;
               const isLeg1 = tie.leg1 && tie.leg1.matchId === matchId;
               const isLeg2 = tie.leg2 && tie.leg2.matchId === matchId;
               if (!isSingle && !isLeg1 && !isLeg2) return tie;
               const newTie = { ...tie };
               if (isSingle) newTie.single = { ...newTie.single, hg: updated.hg, ag: updated.ag };
               if (isLeg1) newTie.leg1 = { ...newTie.leg1, hg: updated.hg, ag: updated.ag };
               if (isLeg2) newTie.leg2 = { ...newTie.leg2, hg: updated.hg, ag: updated.ag };
               return newTie;
            }));
            return { ...e, rounds: resolveCup(rs, t.twoLegs, t.finalOneMatch) };
          }
          return e;
        })
      }));

      const players = recomputePlayerStats(cur.players, newMatches);
      setDb({ ...cur, matches: newMatches, tournaments: newTournaments, players });
      notify('Матч обновлён, статистика пересчитана');
      return {};
    },
    giveAward: (season, playerId) => {
      const res = ballonRanking(dbRef.current, season);
      const r = res.list.find((x) => x.id === playerId) || res.list[0];
      if (!r) return { error: 'Нет кандидатов' };
      const award = makeAward(r, season);
      setDb((p) => ({ ...p, awards: [...p.awards.filter((a) => a.season !== season), award] }));
      notify(`Золотой мяч ${season}: ${award.name}`);
      return {};
    },
    newSeason: () => {
      const cur = dbRef.current;
      const top = ballonRanking(cur, cur.season).list[0];
      const hasAward = cur.awards.some((a) => a.season === cur.season);
      setDb((p) => {
        const r = ballonRanking(p, p.season).list[0];
        const awards = r && !p.awards.some((a) => a.season === p.season) ? [...p.awards, makeAward(r, p.season)] : p.awards;
        return { ...p, awards, season: p.season + 1, players: p.players.map((pl) => (pl.retired || pl.age == null ? pl : { ...pl, age: pl.age + 1 })) };
      });
      notify(top && !hasAward ? `Сезон ${cur.season + 1}. Золотой мяч ${cur.season}: ${top.name}` : `Начался сезон ${cur.season + 1}`);
    },
    reset: () => {
      setDb(buildSeed());
      notify('Игра сброшена к пустой базе');
    }
  };

  const saveActions = {
    saveNow: () => { persistNow(); notify('Игра сохранена'); },
    exportJson: () => JSON.stringify({ v: 3, ts: Date.now(), data: dbRef.current }),
    importJson: (text) => {
      try {
        const p = JSON.parse(text);
        const data = p && p.data ? p.data : p;
        if (!data || !Array.isArray(data.clubs) || !Array.isArray(data.players)) return { error: 'В тексте нет данных игры' };
        setDb(normalizeDb(data));
        return {};
      } catch (e) { return { error: 'Не удалось прочитать текст сохранения' }; }
    },
    loadCloud: async () => {
      return { error: 'Облако отключено. Используйте файл или текст.' };
    },
    reset: () => { act.reset(); }
  };

  const summary = useMemo(() => {
    let matches = db.matches.length;
    if (!matches) {
      db.tournaments.forEach((t) => t.editions.forEach((e) => {
        if (t.type === 'league' && e.fixtures) matches += e.fixtures.filter((f) => f.played).length;
        else if (e.rounds) {
          e.rounds.flat().forEach((tie) => {
            if (tie.played && !tie.bye) matches += 1;
            if (tie.leg1 && tie.leg1.played) matches += 1;
            if (tie.leg2 && tie.leg2.played) matches += 1;
          });
        }
      }));
    }
    return { matches, goals: db.players.reduce((s, p) => s + p.stats.goals, 0) };
  }, [db.tournaments, db.players, db.matches]);

  const matchRecord = matchId ? db.matches.find((m) => m.id === matchId) || null : null;
  const saveLabel = { idle: 'Автосохранение', saving: 'Сохраняю…', saved: 'Сохранено', local: 'Сохранено', error: 'Ошибка сохранения' }[save.status];
  const viewKey = route.playerId ? `p-${route.playerId}` : `${route.tab}-${route.tab === 'clubs' ? route.clubId : ''}`;

  return (
    <NavCtx.Provider value={nav}>
      <header className="masthead text-navyink">
        <div className="gutter">
          <div className="mx-auto max-w-6xl pt-4">
            <div className="flex flex-wrap items-start justify-between gap-3">
              <div className="min-w-0">
                <div className="text-[11px] font-semibold uppercase tracking-[0.2em] opacity-80">Сезон {db.season}</div>
                <h1 className="font-display text-3xl sm:text-5xl font-extrabold uppercase tracking-wide leading-none mt-1">Custom Football Manager</h1>
              </div>
              <div className="flex items-center gap-3">
                <span className="text-xs opacity-80 hidden sm:inline" aria-live="polite">{saveLabel}</span>
                <button type="button" onClick={() => setSaveOpen(true)} className="btn-navy rounded px-3 py-1.5 text-sm font-semibold transition-colors">Сохранение</button>
              </div>
            </div>
            <div className="flex flex-wrap gap-x-6 gap-y-1 mt-3 text-xs opacity-90">
              <span><b className="num">{db.clubs.length}</b> {plural(db.clubs.length, ['клуб', 'клуба', 'клубов'])}</span>
              <span><b className="num">{db.nationalTeams.length}</b> {plural(db.nationalTeams.length, ['сборная', 'сборные', 'сборных'])}</span>
              <span><b className="num">{db.players.filter((p) => !p.retired).length}</b> {plural(db.players.filter((p) => !p.retired).length, ['игрок', 'игрока', 'игроков'])}</span>
              <span><b className="num">{summary.matches}</b> {plural(summary.matches, ['матч', 'матча', 'матчей'])}</span>
              <span><b className="num">{summary.goals}</b> {plural(summary.goals, ['гол', 'гола', 'голов'])}</span>
            </div>
            <nav className="flex overflow-x-auto mt-4 -mb-[3px]" role="tablist" aria-label="Разделы">
              {TABS.map(([key, label]) => {
                const active = route.tab === key && !route.playerId;
                return (
                  <button key={key} type="button" role="tab" aria-selected={active} onClick={() => selectTab(key)}
                    className={`whitespace-nowrap px-3 sm:px-5 py-3 font-display text-lg sm:text-xl font-bold uppercase tracking-wider border-b-[3px] transition-all duration-150 focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan ${active ? 'border-cyan opacity-100' : 'border-transparent opacity-70 hover:opacity-100'}`}>
                    {label}
                  </button>
                );
              })}
            </nav>
          </div>
        </div>
      </header>

      <div className="gutter">
        <div className="mx-auto max-w-6xl py-6">
          <main key={viewKey} className="view-in">
            {route.playerId ? (
              <PlayerProfile playerId={route.playerId} db={db} onBack={back} act={act} />
            ) : route.tab === 'clubs' ? (
              <ClubsTab db={db} clubId={route.clubId} onSelect={(id) => setRoute((r) => ({ ...r, clubId: id }))} />
            ) : route.tab === 'national' ? (
              <NationalTeamsTab db={db} act={act} />
            ) : route.tab === 'transfers' ? (
              <TransfersTab db={db} act={act} />
            ) : route.tab === 'stats' ? (
              <StatsTab db={db} />
            ) : route.tab === 'ballon' ? (
              <BallonTab db={db} act={act} />
            ) : route.tab === 'tournaments' ? (
              <TournamentsTab db={db} act={act} />
            ) : (
              <ManageTab db={db} act={act} />
            )}
          </main>
        </div>
      </div>

      {matchId && <MatchModal match={matchRecord} onClose={() => setMatchId(null)} db={db} act={act} />}
      {clubPickerPlayerId && <ClubPickerModal playerId={clubPickerPlayerId} db={db} act={act} onClose={() => setClubPickerPlayerId(null)} />}
      {saveOpen && <SaveModal save={save} onClose={() => setSaveOpen(false)} actions={saveActions} />}

      {toast && (
        <div className="toast-wrap" role="status" aria-live="polite">
          <div key={toast.id} className={`toast rounded px-4 py-2 text-sm font-semibold shadow-lg ${toast.kind === 'bad' ? 'bg-bad text-badink' : 'bg-navy text-navyink'}`}>
            {toast.msg}
          </div>
        </div>
      )}
    </NavCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
