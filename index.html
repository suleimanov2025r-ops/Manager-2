        {f.played ? (
          f.matchId ? (
            <button type="button" className={btn('ghost', 'sm')} onClick={() => nav.openMatch(f.matchId)}>Центр матча</button>
          ) : (
            <button type="button" className={btn('ghost', 'sm')} onClick={() => setOpen(!open)}>{open ? 'Скрыть события' : 'События матча'}</button>
          )
        ) : (
          edition.status === 'active' && (
            <div className="flex gap-2">
              <button type="button" className={btn('primary', 'sm')} onClick={() => act.simulateEdition(tour.id, edition.id, 'match', f.id)}>Играть</button>
              <button type="button" className={btn('ghost', 'sm')} onClick={() => setManualEdit(true)}>✏️ Счёт</button>
            </div>
          )
        )}
      </div>
      {manualEdit && <ManualMatchEditor tour={tour} edition={edition} fixture={f} db={db} onClose={() => setManualEdit(false)} onSave={createManualMatch} />}
      {open && f.played && !f.matchId && (
        <div className="mt-3 pt-3 border-t border-line fade-in"><MatchEvents events={f.events} /></div>
      )}
    </li>
  );
}

function CupTie({ t, edition, tour, act, db }) {
  const nav = useContext(NavCtx);
  const [manualEditLeg, setManualEditLeg] = useState(null);
  const homeName = t.home ? teamName(edition, t.home) : 'Ожидается';
  const awayName = t.away ? teamName(edition, t.away) : (t.bye ? 'Нет соперника' : 'Ожидается');
  const isSingle = t.final || !tour.twoLegs;
  const singleMatch = t.single;
  const showSingle = isSingle && singleMatch && singleMatch.played;
  const isSingleLegReady = (!t.leg1 && t.home && t.away) || (!t.leg2 && t.leg1);

  const legLine = (label, leg) => {
    if (!leg) return null;
    return (
      <div className="flex items-center justify-between gap-2 px-2 py-1 text-xs text-mute">
        <span>{label}</span><span className="num">{leg.hg}:{leg.ag}</span>
      </div>
    );
  };

  const createManualMatch = (newMatch, legStr) => {
    act.saveManualCupMatch(tour.id, edition.id, t.id, legStr, newMatch);
    setManualEditLeg(null);
  };

  return (
    <div className="border border-line rounded bg-surf overflow-hidden">
      {isSingle ? (
        <>
          <div className={`flex items-center justify-between gap-2 px-3 py-2 ${t.winner && t.home === t.winner ? 'bg-accsoft font-bold' : ''}`}>
            <span className="min-w-0 flex items-center gap-2">
              {t.home && <ClubLogo id={t.home} name={homeName} size={22} />}
              <span className="break-words min-w-0">{homeName}</span>
            </span>
            <span className="num shrink-0">{showSingle ? t.single.hg : ''}{showSingle && t.single.pens ? <span className="text-xs text-mute"> ({t.single.pens.h})</span> : null}</span>
          </div>
          <div className="border-t border-line" />
          <div className={`flex items-center justify-between gap-2 px-3 py-2 ${t.winner && t.away === t.winner ? 'bg-accsoft font-bold' : ''}`}>
            <span className="min-w-0 flex items-center gap-2">
              {t.away && <ClubLogo id={t.away} name={awayName} size={22} />}
              <span className="break-words min-w-0">{awayName}</span>
            </span>
            <span className="num shrink-0">{showSingle ? t.single.ag : ''}{showSingle && t.single.pens ? <span className="text-xs text-mute"> ({t.single.pens.a})</span> : null}</span>
          </div>
        </>
      ) : (
        <>
          <div className={`px-3 py-2 ${t.winner && t.home === t.winner ? 'bg-accsoft' : ''}`}>
            <div className="flex items-center justify-between gap-2">
              <span className="min-w-0 flex items-center gap-2">
                {t.home && <ClubLogo id={t.home} name={homeName} size={22} />}
                <span className="break-words min-w-0 font-semibold">{homeName}</span>
              </span>
              <span className="num shrink-0 font-bold">{t.played ? t.homeAgg : ''}</span>
            </div>
            {legLine('1-й матч (д)', t.leg1)}
            {legLine('2-й матч (г)', t.leg2 ? { hg: t.leg2.ag, ag: t.leg2.hg } : null)}
          </div>
          <div className="border-t border-line" />
          <div className={`px-3 py-2 ${t.winner && t.away === t.winner ? 'bg-accsoft' : ''}`}>
            <div className="flex items-center justify-between gap-2">
              <span className="min-w-0 flex items-center gap-2">
                {t.away && <ClubLogo id={t.away} name={awayName} size={22} />}
                <span className="break-words min-w-0 font-semibold">{awayName}</span>
              </span>
              <span className="num shrink-0 font-bold">{t.played ? t.awayAgg : ''}</span>
            </div>
            {legLine('1-й матч (г)', t.leg1 ? { hg: t.leg1.ag, ag: t.leg1.hg } : null)}
            {legLine('2-й матч (д)', t.leg2)}
          </div>
        </>
      )}
      {t.pens && <div className="px-3 py-1 text-xs text-center text-mute border-t border-line">Пенальти: {t.pens.h} : {t.pens.a}</div>}
      {t.bye && <div className="px-3 py-1 text-xs text-center text-mute border-t border-line">Проходит без игры</div>}
      
      <div className="border-t border-line px-3 py-2 flex justify-end gap-2 flex-wrap">
        {t.played ? (
          <>
            {t.single && t.single.matchId && <button type="button" className={btn('ghost', 'sm')} onClick={() => nav.openMatch(t.single.matchId)}>Центр матча</button>}
            {t.leg1 && t.leg1.matchId && <button type="button" className={btn('ghost', 'sm')} onClick={() => nav.openMatch(t.leg1.matchId)}>1-й матч</button>}
            {t.leg2 && t.leg2.matchId && <button type="button" className={btn('ghost', 'sm')} onClick={() => nav.openMatch(t.leg2.matchId)}>2-й матч</button>}
          </>
        ) : t.home && t.away && edition.status === 'active' ? (
          <div className="flex gap-2">
            <button type="button" className={btn('primary', 'sm')} onClick={() => act.simulateEdition(tour.id, edition.id, 'match', t.id)}>Играть</button>
            {!t.played && (
              <button type="button" className={btn('ghost', 'sm')} onClick={() => setManualEditLeg(isSingle ? 'single' : (!t.leg1 ? 'leg1' : 'leg2'))}>✏️ Счёт</button>
            )}
          </div>
        ) : (
          <span className="text-xs text-mute">Ждём соперников</span>
        )}
      </div>
      {manualEditLeg && <ManualMatchEditor tour={tour} edition={edition} fixture={{ home: manualEditLeg === 'leg1' ? t.home : t.away, away: manualEditLeg === 'leg1' ? t.away : t.home, round: 1 }} db={db} onClose={() => setManualEditLeg(null)} onSave={createManualMatch} />}
    </div>
  );
}

function ChampionBanner({ edition }) {
  if (edition.status !== 'finished' || !edition.championId) return null;

    <div className="bg-navy text-navyink rounded p-4 sm:p-5 fade-in" style={{ borderBottom: '3px solid var(--cyan)' }}>
      <div className="text-xs uppercase tracking-wider opacity-80">Победитель турнира</div>
      <div className="font-display text-4xl font-extrabold uppercase break-words leading-none mt-1">{teamName(edition, edition.championId)}</div>

function SimControls({ tour, edition, act, roundLabel }) {
  const active = edition.status === 'active';

    <div className="flex flex-wrap gap-2">
      <button type="button" className={btn('primary')} disabled={!active} onClick={() => act.simulateEdition(tour.id, edition.id, 'match')}>Симулировать матч</button>
      <button type="button" className={btn('ghost')} disabled={!active} onClick={() => act.simulateEdition(tour.id, edition.id, 'round')}>{roundLabel}</button>

function LeagueView({ tour, edition, act, matches, db, readOnly = false }) {
  const table = useMemo(() => leagueTable(edition), [edition]);
  const roundCount = edition.fixtures[edition.fixtures.length - 1].round;

  return (
    <div className="space-y-4">
      <ChampionBanner edition={edition} />
      {!readOnly && <SimControls tour={tour} edition={edition} act={act} roundLabel="Симулировать тур" />}

      <Panel>
        <Heading className="mb-3">Турнирная таблица</Heading>
        <div className="overflow-x-auto rounded border border-line">
          <table className="tbl w-full text-sm min-w-[32rem]">
            <THead>
              <th className="px-2 py-2 text-left text-[11px] uppercase tracking-wider font-semibold">#</th>
              <th className="px-2 py-2 text-left text-[11px] uppercase tracking-wider font-semibold">Клуб</th>

                <th key={h} className="px-2 py-2 text-center text-[11px] uppercase tracking-wider font-semibold w-10">
                  {h}
                </th>

            </THead>
            <tbody>
              {table.map((r, i) => (
                <tr key={r.id} className={`border-b border-line last:border-0 ${i === 0 && r.p > 0 ? '!bg-accsoft' : ''}`}>
                  <td className="px-2 py-2 text-mute num text-center">{i + 1}</td>
                  <td className="px-2 py-2 font-semibold whitespace-nowrap">
                    <ClubMark id={r.id} name={r.name} size={22} className="font-semibold" />
                  </td>
                  <td className="px-2 py-2 text-center num w-10">{r.p}</td>
                  <td className="px-2 py-2 text-center num w-10">{r.w}</td>
                  <td className="px-2 py-2 text-center num w-10">{r.d}</td>
                  <td className="px-2 py-2 text-center num w-10">{r.l}</td>
                  <td className="px-2 py-2 text-center num w-14">{r.gf}–{r.ga}</td>
                  <td className="px-2 py-2 text-center num w-10">{r.gf - r.ga > 0 ? '+' : ''}{r.gf - r.ga}</td>
                  <td className="px-2 py-2 text-center num font-bold w-10">{r.pts}</td>
                  <td className="px-2 py-2 flex justify-center"><FormDots form={r.form} /></td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </Panel>

      <TournamentLeaders matches={matches} tid={tour.id} />

      <Panel>
        <div className="flex flex-wrap items-center justify-between gap-3">
          <Heading>Расписание</Heading>
          <div className="flex items-center gap-2">
            {!readOnly && (
              <button type="button" className={btn('ghost', 'sm')} onClick={() => setScheduleOpen(true)}>
                Изменить сетку
              </button>
            )}
            <button type="button" className={btn('ghost', 'sm')} disabled={round <= 1} onClick={() => setRound(round - 1)} aria-label="Предыдущий тур">◀</button>
            <label className="sr-only" htmlFor={`rd-${edition.id}`}>Тур</label>
            <select id={`rd-${edition.id}`} className={`${inputCls} !w-auto`} value={round} onChange={(e) => setRound(Number(e.target.value))}>
              {Array.from({ length: roundCount }, (_, i) => i + 1).map((r) => <option key={r} value={r}>Тур {r} из {roundCount}</option>)}
            </select>
            <button type="button" className={btn('ghost', 'sm')} disabled={round >= roundCount} onClick={() => setRound(round + 1)} aria-label="Следующий тур">▶</button>
          </div>
        </div>
        <ul key={round} className="view-in grid gap-3 mt-3 md:grid-cols-2">
          {list.map((f) => <FixtureRow key={f.id} f={f} edition={edition} tour={tour} act={act} db={db} />)}
        </ul>
      </Panel>
      {scheduleOpen && (
        <ScheduleEditor 
          tour={tour} edition={edition} onClose={() => setScheduleOpen(false)} 
          onSave={(newFixtures) => { act.updateSchedule(tour.id, edition.id, newFixtures); setScheduleOpen(false); }} 
        />
      )}
    </div>
  );
}

function CupView({ tour, edition, act, matches, db, readOnly = false }) {

      <ChampionBanner edition={edition} />
      {!readOnly && <SimControls tour={tour} edition={edition} act={act} roundLabel="Симулировать раунд" />}
      <Panel>
        <Heading className="mb-3">Турнирная сетка{tour.twoLegs ? ' · два матча в каждом раунде, финал — один' : ''}</Heading>
        <div className="overflow-x-auto pb-2">
          <div className="flex items-stretch gap-4 min-w-max">
            {edition.rounds.map((round, ri) => (
              <div key={ri} className="w-72 flex flex-col">
                <div className="text-[11px] font-semibold uppercase tracking-wider text-mute mb-2">{cupRoundName(round.length)}</div>

          <div className="min-w-0">
            <div className="text-xs font-semibold uppercase tracking-wider text-mute">

function NewTournament({ db, act, onCreated }) {
  const [name, setName] = useState('');
  const [type, setType] = useState('league');
  const [twoLegs, setTwoLegs] = useState(true);
  const [finalOneMatch, setFinalOneMatch] = useState(true);
  const [national, setNational] = useState(false);
  const [picked, setPicked] = useState([]);
  const [logo, setLogo] = useState(null);
  const [error, setError] = useState('');

  const toggle = (id) => setPicked((p) => (p.includes(id) ? p.filter((x) => x !== id) : [...p, id]));
  const n = picked.length;
  const size = n >= 2 ? Math.pow(2, Math.ceil(Math.log2(n))) : 0;
  const pool = national ? db.nationalTeams : db.clubs;

  const submit = (e) => {
    e.preventDefault();
    const r = act.createTournament({ name, type, clubIds: picked, logo, twoLegs, finalOneMatch, national });
    if (r.error) { setError(r.error); return; }
    setError(''); setName(''); setPicked([]); setLogo(null);
    onCreated(r.id, r.editionId);
  };

  return (
    <form onSubmit={submit} className="grid lg:grid-cols-2 gap-4 items-start">
      <Panel>
        <Heading>Новый турнир · сезон {db.season}</Heading>
        <div className="grid gap-4 mt-4">
          <div>
            <label className={labelCls} htmlFor="tn-name">Название</label>
            <input id="tn-name" className={inputCls} placeholder="Например, Кубок осени" value={name} onChange={(e) => setName(e.target.value)} />
          </div>
          <LogoField label="Логотип турнира (необязательно)" name={name || 'Турнир'} value={logo} onChange={setLogo} />
          <div>
            <span className={labelCls}>Тип</span>
            <div className="grid sm:grid-cols-2 gap-2" role="radiogroup" aria-label="Тип турнира">
              {[['league', 'Регулярный чемпионат', 'Каждый с каждым, дома и в гостях. Таблица очков.'], ['cup', 'Плей-офф', 'Сетка на вылет. Победитель по сумме двух матчей.']].map(([key, title, text]) => (
                <button key={key} type="button" role="radio" aria-checked={type === key} onClick={() => setType(key)}
                  className={`text-left rounded border p-3 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-acc ${type === key ? 'border-acc bg-accsoft' : 'border-line bg-surf hover:bg-surf2'}`}>
                  <span className="block font-semibold">{title}</span>
                  <span className="block text-xs text-mute mt-1">{text}</span>
                </button>
              ))}
            </div>
          </div>
          {type === 'cup' && (
            <div className="space-y-2">
              <label className="flex items-center gap-2 text-sm">
                <input type="checkbox" className="h-4 w-4 accent-[var(--acc)]" checked={twoLegs} onChange={(e) => setTwoLegs(e.target.checked)} />
                Два матча (дома/в гостях) в каждом раунде, кроме финала
              </label>
              <label className="flex items-center gap-2 text-sm">
                <input type="checkbox" className="h-4 w-4 accent-[var(--acc)]" checked={finalOneMatch} onChange={(e) => setFinalOneMatch(e.target.checked)} />
                Финал — один матч
              </label>
            </div>
          )}
          <div>
            <span className={labelCls}>Участники</span>
            <div className="grid sm:grid-cols-2 gap-2">
              <button type="button" role="radio" aria-checked={!national} onClick={() => { setNational(false); setPicked([]); }}
                className={`text-left rounded border p-2 text-sm ${!national ? 'border-acc bg-accsoft' : 'border-line bg-surf hover:bg-surf2'}`}>Клубы</button>
              <button type="button" role="radio" aria-checked={national} onClick={() => { setNational(true); setPicked([]); }}
                className={`text-left rounded border p-2 text-sm ${national ? 'border-acc bg-accsoft' : 'border-line bg-surf hover:bg-surf2'}`}>Сборные (World Cup)</button>
            </div>
          </div>
          <div className="border border-line rounded bg-surf2 p-3 text-sm">
            {n < 2 && <span className="text-mute">Отметьте минимум два участника.</span>}
            {n >= 2 && type === 'league' && (
              <span><span className="num font-semibold">{n}</span> {plural(n, ['участник', 'участника', 'участников'])}: <span className="num font-semibold">{n * (n - 1)}</span> {plural(n * (n - 1), ['матч', 'матча', 'матчей'])}.</span>
            )}
            {n >= 2 && type === 'cup' && (
              <span>Сетка: «{cupRoundName(size / 2)}»{size - n > 0 ? `. Без игры в первом раунде: ${size - n}` : ''}.</span>
            )}
          </div>
          {error && <p className="text-sm text-bad">{error}</p>}
          <button type="submit" className={btn('primary')}>Создать турнир</button>
        </div>
      </Panel>

      <Panel className="!p-0">
        <div className="px-4 py-3 border-b border-line flex flex-wrap items-center justify-between gap-2">
          <span className="text-[11px] font-semibold uppercase tracking-wider text-mute">Участники · выбрано {n} из {pool.length}</span>
          <span className="flex gap-2">
            <button type="button" className={btn('ghost', 'sm')} onClick={() => setPicked(pool.map((c) => c.id))}>Все</button>
            <button type="button" className={btn('ghost', 'sm')} onClick={() => setPicked([])}>Сбросить</button>
          </span>
        </div>
        {pool.length === 0 && <Empty>{national ? 'Сначала создайте сборные на вкладке «Сборные».' : 'Сначала создайте клубы на вкладке «База».'}</Empty>}
        <ul className="max-h-[28rem] overflow-y-auto">
          {pool.map((c) => {
            const sq = national ? db.players.filter((p) => p.countryId === c.id && !p.retired) : squadOf(db.players, c.id);
            const checked = picked.includes(c.id);
            return (
              <li key={c.id} className="border-b border-line last:border-0">
                <label htmlFor={`pick-${c.id}`} className={`flex items-center gap-3 px-4 py-3 cursor-pointer transition-colors ${checked ? 'bg-accsoft' : 'hover:bg-surf2'}`}>
                  <input id={`pick-${c.id}`} type="checkbox" className="h-4 w-4 accent-[var(--acc)]" checked={checked} onChange={() => toggle(c.id)} />
                  <Logo src={c.logo} name={c.name} size={30} />
                  <span className="min-w-0 flex-1">
                    <span className="block font-semibold break-words">{c.name}</span>
                    <span className="block text-xs text-mute">{sq.length} {plural(sq.length, ['игрок', 'игрока', 'игроков'])}</span>
                  </span>
                  <span className="num font-semibold">{sq.length ? teamRatings(sq).overall.toFixed(1) : '—'}</span>
                </label>
              </li>
            );
          })}
        </ul>
      </Panel>
    </form>
  );
}

function LaunchEdition({ tour, db, act, onLaunched }) {
  const [picked, setPicked] = useState([]);
  const [error, setError] = useState('');
  const national = !!tour.national;
  const pool = national ? db.nationalTeams : db.clubs;
  const activeEdition = tour.editions.find((e) => e.status === 'active');

  useEffect(() => { setPicked([]); setError(''); }, [tour.id]);

  const toggle = (id) => setPicked((p) => (p.includes(id) ? p.filter((x) => x !== id) : [...p, id]));
  const n = picked.length;
  const launch = () => {
    const r = act.launchEdition(tour.id, picked);
    if (r.error) { setError(r.error); return; }
    setError('');
    onLaunched(r.editionId);
  };

  if (activeEdition) {
    return (
      <Panel>
        <Heading>Активный розыгрыш</Heading>
        <p className="text-sm text-mute mt-3">В сезоне {activeEdition.season} уже идёт розыгрыш. Завершите или удалите его, чтобы запустить новый.</p>
      </Panel>
    );
  }

  return (
    <Panel>
      <Heading>Запуск розыгрыша · сезон {db.season}</Heading>
      <p className="text-sm text-mute mt-3">
        {national ? 'Выберите страны-участницы. После запуска нужно будет заполнить заявку каждой сборной.' : 'Выберите участников этого розыгрыша. Состав можно менять каждый сезон.'}
      </p>
      <div className="mt-4 flex flex-wrap items-center justify-between gap-2">
        <span className="text-[11px] font-semibold uppercase tracking-wider text-mute">Выбрано {n} из {pool.length}</span>
        <span className="flex gap-2">
          <button type="button" className={btn('ghost', 'sm')} onClick={() => setPicked(pool.map((c) => c.id))}>Все</button>
          <button type="button" className={btn('ghost', 'sm')} onClick={() => setPicked([])}>Сбросить</button>
        </span>
      </div>
      {pool.length === 0 && <Empty>{national ? 'Создайте сборные на вкладке «Сборные».' : 'Создайте клубы на вкладке «База».'}</Empty>}
      <ul className="mt-2 max-h-[24rem] overflow-y-auto border border-line rounded">
        {pool.map((c) => {
          const sq = national ? db.players.filter((p) => p.countryId === c.id && !p.retired) : squadOf(db.players, c.id);
          const checked = picked.includes(c.id);
          return (
            <li key={c.id} className="border-b border-line last:border-0">
              <label htmlFor={`le-${c.id}`} className={`flex items-center gap-3 px-3 py-2 cursor-pointer ${checked ? 'bg-accsoft' : 'hover:bg-surf2'}`}>
                <input id={`le-${c.id}`} type="checkbox" className="h-4 w-4 accent-[var(--acc)]" checked={checked} onChange={() => toggle(c.id)} />
                <Logo src={c.logo} name={c.name} size={26} />
                <span className="min-w-0 flex-1 font-semibold break-words">{c.name}</span>
                <span className="text-xs text-mute">{sq.length} игр.</span>
              </label>
            </li>
          );
        })}
      </ul>
      {error && <p className="text-sm text-bad mt-2">{error}</p>}
      <button type="button" className={`${btn('primary')} mt-3`} disabled={n < 2} onClick={launch}>Запустить розыгрыш {db.season}</button>
    </Panel>
  );
}

function WorldCupSquadEditor({ tour, edition, db, act }) {
  const [countryId, setCountryId] = useState(edition.teams[0] ? edition.teams[0].id : '');
  useEffect(() => { if (!edition.teams.some((t) => t.id === countryId)) setCountryId(edition.teams[0] ? edition.teams[0].id : ''); }, [edition.id]);
  const country = db.nationalTeams.find((c) => c.id === countryId);
  const available = useMemo(() => db.players.filter((p) => p.countryId === countryId && !p.retired), [db.players, countryId]);
  const squad = edition.squads && edition.squads[countryId] ? edition.squads[countryId] : [];
  const toggle = (id) => act.toggleWcSquad(tour.id, edition.id, countryId, id);
  if (!country) return <Panel><Empty>Выберите страну.</Empty></Panel>;

  return (
    <Panel>
      <Heading className="mb-3">Заявка сборной</Heading>
      <div className="flex flex-wrap items-end gap-3 mb-3">
        <div className="min-w-0 basis-56">
          <label className={labelCls} htmlFor="wc-country">Сборная</label>
          <select id="wc-country" className={inputCls} value={countryId} onChange={(e) => setCountryId(e.target.value)}>
            {edition.teams.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
          </select>
        </div>
        <div className="text-sm text-mute">Выбрано {squad.length} из {available.length}</div>
      </div>
      {available.length === 0 && <Empty>У этой сборной нет игроков в базе. Назначьте страну игрокам во вкладке «База».</Empty>}
      <ul className="max-h-[24rem] overflow-y-auto border border-line rounded">
        {available.map((p) => {
          const checked = squad.includes(p.id);
          return (
            <li key={p.id} className="border-b border-line last:border-0">
              <label htmlFor={`wc-${p.id}`} className={`flex items-center gap-3 px-3 py-2 cursor-pointer ${checked ? 'bg-accsoft' : 'hover:bg-surf2'}`}>
                <input id={`wc-${p.id}`} type="checkbox" className="h-4 w-4 accent-[var(--acc)]" checked={checked} onChange={() => toggle(p.id)} />
                <PosChip pos={p.pos} />
                <span className="min-w-0 flex-1 break-words">{p.name}</span>
                <span className="text-xs text-mute num">OVR {p.ovr}{p.age ? ` · ${p.age} лет` : ''}</span>
              </label>
            </li>
          );
        })}
      </ul>
    </Panel>
  );
}

          <Metric label="Матчей" value={hist.matches.length} /><Metric label="Голов" value={hist.players.reduce((s, r) => s + r.s.goals, 0)} />

                    <td className="px-2 py-2 text-right num">{r.p}</td><td className="px-2 py-2 text-right num">{r.w}</td>
                    <td className="px-2 py-2 text-right num">{r.d}</td><td className="px-2 py-2 text-right num">{r.l}</td>

function SeasonArchive({ db }) {
  const seasons = useMemo(() => seasonsOf(db), [db]);
  const [season, setSeason] = useState(seasons[0] || db.season);
  const entries = useMemo(() => {
    const out = [];
    db.tournaments.forEach((t) => { t.editions.forEach((e) => { if (e.season === season) out.push({ tour: t, edition: e }); }); });
    return out;
  }, [db.tournaments, season]);

  return (
    <div className="space-y-4">
      <Panel>
        <div className="flex flex-wrap items-end gap-3">
          <div className="min-w-0 basis-40">
            <label className={labelCls} htmlFor="arch-season">Сезон</label>
            <select id="arch-season" className={inputCls} value={season} onChange={(e) => setSeason(Number(e.target.value))}>
              {seasons.map((s) => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
        </div>
      </Panel>
      {entries.length === 0 ? <Panel><Empty>В сезоне {season} не было турниров.</Empty></Panel> : (
        <div className="grid md:grid-cols-2 gap-4">
          {entries.map(({ tour, edition }) => {
            const prog = editionProgress(tour, edition);
            return (
              <Panel key={`${tour.id}-${edition.id}`}>
                <div className="flex items-center gap-3 mb-2">
                  <Logo src={tour.logo} name={tour.name} size={40} />
                  <div className="min-w-0">
                    <div className="font-display text-2xl font-bold uppercase break-words leading-none">{tour.name}</div>
                    <div className="text-xs text-mute">{tour.type === 'league' ? 'Лига' : 'Плей-офф'}{tour.twoLegs ? ' · два матча' : ''}</div>
                  </div>
                </div>
                <div className="text-sm">
                  <div>Сыграно {prog.done} из {prog.total}</div>
                  {edition.status === 'finished' && edition.championId ? (
                    <div className="mt-1 flex items-center gap-2">
                      <span className="text-[11px] uppercase tracking-wider text-mute">Победитель</span>
                      <ClubLogo id={edition.championId} name={teamName(edition, edition.championId)} size={22} />
                      <span className="font-semibold">{teamName(edition, edition.championId)}</span>
                    </div>
                  ) : <div className="text-mute text-sm mt-1">Идёт</div>}
                </div>
              </Panel>
            );
          })}
        </div>
      )}
    </div>
  );
}

function TournamentsTab({ db, act }) {
  const [view, setView] = useState(db.tournaments.some((t) => t.editions.length) ? 'list' : 'new');
  const [selId, setSelId] = useState(db.tournaments[0] ? db.tournaments[0].id : null);
  const [mode, setMode] = useState('active');
  const [selEditionId, setSelEditionId] = useState(null);

  const selected = db.tournaments.find((t) => t.id === selId) || db.tournaments[0] || null;

  useEffect(() => {
    if (!selected) return;
    const actEd = selected.editions.find((e) => e.status === 'active');
    setSelEditionId(actEd ? actEd.id : null);
    setMode(actEd ? 'active' : 'launch');
  }, [selId, db.tournaments.length]);

  const tabBtn = (key, label) => (
    <button type="button" onClick={() => setView(key)}
      className={`${btn('ghost')} ${view === key ? '!bg-btn !text-btnink !border-transparent' : ''}`}>{label}</button>
  );
  const modeBtn = (key, label) => (
    <button type="button" onClick={() => setMode(key)}
      className={`${btn('ghost', 'sm')} ${mode === key ? '!bg-accsoft !border-acc' : ''}`}>{label}</button>
  );

  const editions = selected ? [...selected.editions].sort((a, b) => b.season - a.season) : [];
  const activeEdition = editions.find((e) => e.status === 'active');
  const viewEdition = selEditionId ? editions.find((e) => e.id === selEditionId) : activeEdition;

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-center justify-between gap-3">
        <div className="flex flex-wrap gap-2">
          {tabBtn('new', 'Конструктор турнира')}
          {tabBtn('list', `Мои турниры · ${db.tournaments.length}`)}
          {tabBtn('archive', 'Архив сезонов')}
        </div>
        <div className="flex flex-wrap items-center gap-3">
          <span className="text-sm text-mute">Текущий сезон: <b className="text-ink num">{db.season}</b></span>
          <ConfirmButton size="sm" label={`Начать сезон ${db.season + 1}`} confirmLabel="Начать новый сезон" onConfirm={act.newSeason} />
        </div>
      </div>

      {view === 'new' ? (
        <div key="new" className="view-in">
          <NewTournament db={db} act={act} onCreated={(id, edId) => { setSelId(id); setSelEditionId(edId); setMode('active'); setView('list'); }} />
        </div>
      ) : view === 'archive' ? (
        <div key="archive" className="view-in"><SeasonArchive db={db} /></div>
      ) : !selected ? (
        <Panel><Empty>Турниров пока нет. Соберите первый в конструкторе.</Empty></Panel>
      ) : (
        <div className="space-y-4">
          <ul className="flex gap-3 overflow-x-auto pb-1">
            {db.tournaments.map((t) => {
              const active = selected.id === t.id;
              const activeEd = t.editions.find((e) => e.status === 'active');
              return (
                <li key={t.id} className="shrink-0">
                  <button type="button" onClick={() => setSelId(t.id)}
                    className={`w-64 text-left rounded border p-3 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-acc ${active ? 'border-acc bg-accsoft' : 'border-line bg-surf hover:bg-surf2'}`}>
                    <span className="flex items-center gap-2">
                      <Logo src={t.logo} name={t.name} size={28} />
                      <span className="block font-semibold break-words min-w-0">{t.name}</span>
                    </span>
                    <span className="block text-xs text-mute mt-1">
                      {t.type === 'league' ? 'Лига' : 'Плей-офф'}{t.national ? ' · Сборные' : ''} · {t.editions.length} {plural(t.editions.length, ['розыгрыш', 'розыгрыша', 'розыгрышей'])}
                      {activeEd ? ` · идёт ${activeEd.season}` : ''}
                    </span>
                  </button>
                </li>
              );
            })}
          </ul>

          <Panel>
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div className="flex flex-wrap gap-2">
                {modeBtn('active', 'Активный розыгрыш')}
                {modeBtn('launch', 'Запустить розыгрыш')}
                {modeBtn('history', 'История')}
                {selected.national && modeBtn('wc', 'Заявки сборных')}
              </div>
              <ConfirmButton size="sm" label="Удалить турнир" confirmLabel="Удалить со всей историей" onConfirm={() => act.deleteTournament(selected.id)} />
            </div>
            <div className="mt-3">
              <LogoField key={selected.id} label="Логотип турнира" name={selected.name} value={selected.logo} onChange={(v) => act.setTournamentLogo(selected.id, v)} />
            </div>
          </Panel>

          {mode === 'active' && (
            viewEdition ? (
              <div className="space-y-3">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <div className="text-sm text-mute">
                    Розыгрыш {viewEdition.season}{editions.length > 1 ? ' · выбрать другой год: ' : ''}
                    {editions.length > 1 && (
                      <select className={inputCls + ' !w-auto !inline-block mt-1'} value={viewEdition.id} onChange={(e) => setSelEditionId(e.target.value)}>
                        {editions.map((e) => <option key={e.id} value={e.id}>{e.season}{e.status === 'finished' ? ' (завершён)' : ''}</option>)}
                      </select>
                    )}
                  </div>
                  {viewEdition.status === 'finished' && (
                    <ConfirmButton size="sm" label="Удалить розыгрыш" confirmLabel="Удалить со всей статистикой" onConfirm={() => act.deleteEdition(selected.id, viewEdition.id)} />
                  )}
                </div>
                <TournamentView tour={selected} edition={viewEdition} act={act} matches={db.matches} db={db} />
              </div>
            ) : (
              <Panel><Empty>Активных розыгрышей нет. Запустите новый на вкладке «Запустить розыгрыш».</Empty></Panel>
            )
          )}

          {mode === 'launch' && <LaunchEdition tour={selected} db={db} act={act} onLaunched={(edId) => { setSelEditionId(edId); setMode('active'); }} />}
          {mode === 'history' && <TournamentHistory tour={selected} db={db} />}
          {mode === 'wc' && activeEdition && <WorldCupSquadEditor tour={selected} edition={activeEdition} db={db} act={act} />}
        </div>
      )}
    </div>
  );
}

function PlayerEditRow({ player, db, act, onDone }) {
  const [name, setName] = useState(player.name);
  const [pos, setPos] = useState(player.pos);
  const [ovr, setOvr] = useState(String(player.ovr));
  const [number, setNumber] = useState(player.number ? String(player.number) : '');
  const [countryId, setCountryId] = useState(player.countryId || '');
  const [age, setAge] = useState(player.age != null ? String(player.age) : '');
  const [clubId, setClubId] = useState(player.clubId || '');
  const [error, setError] = useState('');
  const save = () => {
    const r = act.updatePlayer(player.id, { name, pos, ovr, number, countryId, age, clubId });
    if (r.error) setError(r.error); else onDone();
  };
  return (
    <tr className="bg-surf2">
      <td colSpan={6} className="p-3">
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2 items-end">
          <div className="col-span-2 min-w-0"><label className={labelCls} htmlFor={`en-${player.id}`}>Имя</label>

          <div className="min-w-0"><label className={labelCls} htmlFor={`ep-${player.id}`}>Позиция</label>
            <select id={`ep-${player.id}`} className={inputCls} value={pos} onChange={(e) => setPos(e.target.value)}>{POSITIONS.map((p) => <option key={p} value={p}>{p}</option>)}</select></div>
          <div className="min-w-0"><label className={labelCls} htmlFor={`eo-${player.id}`}>OVR</label>
            <input id={`eo-${player.id}`} type="number" min="40" max="99" className={inputCls} value={ovr} onChange={(e) => setOvr(e.target.value)} /></div>
          <div className="min-w-0"><label className={labelCls} htmlFor={`enum-${player.id}`}>Номер</label>
            <input id={`enum-${player.id}`} type="number" min="1" max="99" className={inputCls} value={number} onChange={(e) => setNumber(e.target.value)} /></div>
          <div className="min-w-0"><label className={labelCls} htmlFor={`eage-${player.id}`}>Возраст</label>
            <input id={`eage-${player.id}`} type="number" min="15" max="60" className={inputCls} value={age} onChange={(e) => setAge(e.target.value)} placeholder="—" /></div>
          <div className="min-w-0"><label className={labelCls} htmlFor={`ecountry-${player.id}`}>Страна</label>

            </select></div>

            <button type="button" className={btn('primary')} onClick={save}>Сохранить</button>

          </div>
        </div>
        {error && <p className="text-xs text-bad mt-2">{error}</p>}

}

function PlayerRow({ p, db, act, editingId, setEditingId }) {

    <tr className="border-b border-line last:border-0">

          <button type="button" className={btn('ghost', 'sm')} onClick={() => setEditingId(p.id)}>Изменить</button>
          {p.retired ? (
            <button type="button" className={btn('ghost', 'sm')} onClick={() => act.resumeCareer(p.id)}>Возобновить</button>

function PlayersPanel({ db, act, filter = 'active' }) {
  const [query, setQuery] = useState('');
  const [posFilter, setPosFilter] = useState('');
  const [clubFilter, setClubFilter] = useState('');
  const [countryFilter, setCountryFilter] = useState('');
  const [editingId, setEditingId] = useState(null);
  const [limit, setLimit] = useState(100);

  const [pName, setPName] = useState('');
  const [pPos, setPPos] = useState('MID');
  const [pOvr, setPOvr] = useState('70');
  const [pClub, setPClub] = useState('');
  const [pCountry, setPCountry] = useState('');
  const [pAge, setPAge] = useState('');
  const [addError, setAddError] = useState('');

  const submitPlayer = (e) => {
    e.preventDefault();
    const r = act.addPlayer({ name: pName, pos: pPos, ovr: pOvr, clubId: pClub, countryId: pCountry, age: pAge });
    if (r.error) { setAddError(r.error); return; }
    setAddError(''); setPName(''); setPAge('');
  };

  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    return db.players.filter((p) => {
      if (filter === 'active' && p.retired) return false;
      if (filter === 'retired' && !p.retired) return false;
      if (filter === 'free' && (p.retired || p.clubId)) return false;
      if (q && !p.name.toLowerCase().includes(q)) return false;
      if (posFilter && p.pos !== posFilter) return false;
      if (clubFilter && p.clubId !== clubFilter) return false;
      if (countryFilter && p.countryId !== countryFilter) return false;
      return true;
    }).sort((a, b) => POS_ORDER[a.pos] - POS_ORDER[b.pos] || b.ovr - a.ovr || a.name.localeCompare(b.name, 'ru'));
  }, [db.players, filter, query, posFilter, clubFilter, countryFilter]);

  return (
    <div className="space-y-4">
      <Panel>
        <form onSubmit={submitPlayer}>
          <div className="text-[11px] font-semibold uppercase tracking-wider text-mute mb-2">Добавить игрока</div>
          <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-8 gap-2 items-end">
            <div className="col-span-2 sm:col-span-1 min-w-0"><label className={labelCls} htmlFor="np-name">Имя</label>
              <input id="np-name" className={inputCls} placeholder="Имя игрока" value={pName} onChange={(e) => setPName(e.target.value)} /></div>
            <div className="min-w-0"><label className={labelCls} htmlFor="np-pos">Позиция</label>
              <select id="np-pos" className={inputCls} value={pPos} onChange={(e) => setPPos(e.target.value)}>{POSITIONS.map((p) => <option key={p} value={p}>{p}</option>)}</select></div>
            <div className="min-w-0"><label className={labelCls} htmlFor="np-ovr">OVR</label>
              <input id="np-ovr" type="number" min="40" max="99" className={inputCls} value={pOvr} onChange={(e) => setPOvr(e.target.value)} /></div>
            <div className="min-w-0"><label className={labelCls} htmlFor="np-age">Возраст</label>
              <input id="np-age" type="number" min="15" max="60" className={inputCls} value={pAge} onChange={(e) => setPAge(e.target.value)} placeholder="—" /></div>
            <div className="col-span-2 sm:col-span-1 min-w-0"><label className={labelCls} htmlFor="np-club">Клуб</label>
              <select id="np-club" className={inputCls} value={pClub} onChange={(e) => setPClub(e.target.value)}>
                <option value="">Свободный агент</option>{db.clubs.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select></div>
            <div className="col-span-2 sm:col-span-1 min-w-0"><label className={labelCls} htmlFor="np-country">Страна</label>
              <select id="np-country" className={inputCls} value={pCountry} onChange={(e) => setPCountry(e.target.value)}>
                <option value="">—</option>{db.nationalTeams.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
              </select></div>
            <div className="col-span-2 sm:col-span-1"><button type="submit" className={`${btn('primary')} w-full`}>Добавить</button></div>
          </div>
          {addError && <p className="text-xs text-bad mt-2">{addError}</p>}
        </form>
      </Panel>

      <Panel>
        <div className="flex flex-wrap items-end gap-3 mb-3">
          <div className="min-w-0 flex-1 basis-44"><label className={labelCls} htmlFor="pp-q">Поиск</label>
            <input id="pp-q" className={inputCls} placeholder="Имя игрока" value={query} onChange={(e) => setQuery(e.target.value)} /></div>
          <div className="min-w-0 basis-28"><label className={labelCls} htmlFor="pp-pos">Позиция</label>
            <select id="pp-pos" className={inputCls} value={posFilter} onChange={(e) => setPosFilter(e.target.value)}>
              <option value="">Все</option>{POSITIONS.map((p) => <option key={p} value={p}>{p}</option>)}</select></div>
          <div className="min-w-0 basis-40"><label className={labelCls} htmlFor="pp-club">Клуб</label>
            <select id="pp-club" className={inputCls} value={clubFilter} onChange={(e) => setClubFilter(e.target.value)}>
              <option value="">Все</option>{db.clubs.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
          <div className="min-w-0 basis-40"><label className={labelCls} htmlFor="pp-country">Страна</label>
            <select id="pp-country" className={inputCls} value={countryFilter} onChange={(e) => setCountryFilter(e.target.value)}>
              <option value="">Все</option>{db.nationalTeams.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}</select></div>
        </div>
        <div className="text-xs text-mute mb-2">Найдено: {filtered.length}</div>
        <div className="overflow-x-auto rounded border border-line">
          {filtered.length === 0 ? <Empty>{filter === 'retired' ? 'Нет завершивших карьеру.' : filter === 'free' ? 'Нет свободных агентов.' : 'Игроки не найдены.'}</Empty> : (
            <table className="tbl w-full text-sm min-w-[40rem]">
              <THead>
                <th className="px-2 py-2 text-left text-[11px] uppercase tracking-wider font-semibold">Поз.</th>
                <th className="px-2 py-2 text-left text-[11px] uppercase tracking-wider font-semibold">Игрок</th>
                <th className="px-2 py-2 text-right text-[11px] uppercase tracking-wider font-semibold">OVR</th>
                <th className="px-2 py-2 text-right text-[11px] uppercase tracking-wider font-semibold">Возраст</th>
                <th className="px-2 py-2 text-left text-[11px] uppercase tracking-wider font-semibold">Страна</th>
                <th className="px-2 py-2 text-left text-[11px] uppercase tracking-wider font-semibold">Клуб</th>
                <th className="px-2 py-2 text-right text-[11px] uppercase tracking-wider font-semibold">М·Г·MVP</th>
                <th className="px-2 py-2 text-right text-[11px] uppercase tracking-wider font-semibold">Действия</th>
              </THead>
              <tbody>
                {filtered.slice(0, limit).map((p) => (
                  <PlayerRow key={p.id} p={p} db={db} act={act} editingId={editingId} setEditingId={setEditingId} />
                ))}
              </tbody>
            </table>
          )}
        </div>
        {filtered.length > limit && (
          <div className="mt-3 flex justify-center">
            <button type="button" className={btn('ghost')} onClick={() => setLimit(limit + 100)}>Показать ещё ({filtered.length - limit})</button>
          </div>
        )}
      </Panel>
    </div>
  );
}

function ClubsManage({ db, act }) {
  const [selId, setSelId] = useState(db.clubs[0] ? db.clubs[0].id : null);
  const [newName, setNewName] = useState('');
  const [error, setError] = useState('');
  const selected = db.clubs.find((c) => c.id === selId) || db.clubs[0] || null;

  useEffect(() => { if (selected && !db.clubs.find((c) => c.id === selected.id)) setSelId(db.clubs[0] ? db.clubs[0].id : null); }, [db.clubs.length]);

  const create = (e) => {
    e.preventDefault();
    const r = act.addClub(newName);
    if (r.error) { setError(r.error); return; }
    setError(''); setNewName(''); setSelId(r.id);
  };

  return (
    <div className="grid lg:grid-cols-[18rem_minmax(0,1fr)] gap-4 items-start">
      <div className="space-y-4 min-w-0">
        <Panel>
          <form onSubmit={create}>

            <div className="flex gap-2">
              <input id="club-new" className={inputCls} placeholder="Название клуба" value={newName} onChange={(e) => setNewName(e.target.value)} />
              <button type="submit" className={`${btn('primary')} shrink-0`}>Создать</button>
            </div>
            {error && <p className="text-xs text-bad mt-2">{error}</p>}

        </Panel>
        <Panel className="!p-0">
          <div className="px-4 py-3 border-b border-line text-[11px] font-semibold uppercase tracking-wider text-mute">Клубы · {db.clubs.length}</div>
          {db.clubs.length === 0 && <Empty>Клубов нет. Создайте первый.</Empty>}
          <ul className="max-h-[28rem] overflow-y-auto">
            {db.clubs.map((c) => {
              const sq = squadOf(db.players, c.id);
              const r = teamRatings(sq);

              return (
                <li key={c.id} className="border-b border-line last:border-0">

                    className={`w-full text-left px-4 py-3 flex items-center justify-between gap-3 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-acc ${active ? 'bg-accsoft' : 'hover:bg-surf2'}`}>
                    <span className="min-w-0 flex items-center gap-3">

                      <span className="min-w-0">
                        <span className="block font-semibold break-words">{c.name}</span>

                      </span>

                      <span className="block font-display text-xl font-bold num">{sq.length ? r.overall.toFixed(1) : '—'}</span>
                      <span className="block text-[11px] uppercase tracking-wider text-mute">OVR</span>
                    </span>
                  </button>
                </li>
              );
            })}
          </ul>
        </Panel>
      </div>
      <div className="min-w-0">
        {selected ? <ClubDetail club={selected} db={db} act={act} /> : <Panel><Empty>Выберите или создайте клуб.</Empty></Panel>}
      </div>
    </div>
  );
}

function ClubDetail({ club, db, act }) {
  const [editingId, setEditingId] = useState(null);
  const [renaming, setRenaming] = useState(false);
  const [clubName, setClubName] = useState(club.name);
  const [renameError, setRenameError] = useState('');

  useEffect(() => { setEditingId(null); setRenaming(false); setClubName(club.name); setRenameError(''); }, [club.id]);

  const squad = useMemo(() => sortRoster(squadOf(db.players, club.id)), [db.players, club.id]);
  const ratings = teamRatings(squad);
  const hasSquad = squad.length > 0;

  const submitRename = (e) => {
    e.preventDefault();
    const r = act.renameClub(club.id, clubName);
    if (r.error) { setRenameError(r.error); return; }
    setRenameError(''); setRenaming(false);
  };

  return (
    <Panel>
      <div className="flex flex-wrap items-start justify-between gap-3">
        <div className="min-w-0">
          {renaming ? (
            <form onSubmit={submitRename} className="flex flex-wrap gap-2">
              <input id="club-rename" aria-label="Новое название клуба" className={`${inputCls} sm:w-64`} value={clubName} onChange={(e) => setClubName(e.target.value)} />
              <button type="submit" className={btn('primary')}>Сохранить</button>
              <button type="button" className={btn('ghost')} onClick={() => { setRenaming(false); setClubName(club.name); setRenameError(''); }}>Отмена</button>
            </form>
          ) : <h2 className="font-display text-3xl font-bold uppercase tracking-wide break-words">{club.name}</h2>}
          {renameError && <p className="text-xs text-bad mt-1">{renameError}</p>}
        </div>
        <div className="flex gap-2">
          {!renaming && <button type="button" className={btn('ghost', 'sm')} onClick={() => setRenaming(true)}>Переименовать</button>}
          <ConfirmButton size="sm" label="Удалить клуб" confirmLabel="Удалить. Игроки станут свободными" onConfirm={() => act.deleteClub(club.id)} />
        </div>
      </div>

      <div className="mt-4 pt-4 border-t border-line">
        <LogoField key={club.id} label="Логотип клуба" name={club.name} value={club.logo} onChange={(v) => act.setClubLogo(club.id, v)} />
      </div>

      <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mt-4 pt-4 pb-4 border-t border-b border-line">
        <Metric label="Игроков" value={squad.length} /><Metric label="Общий OVR" value={hasSquad ? ratings.overall.toFixed(1) : '—'} />
        <Metric label="Атака" value={hasSquad ? ratings.attack.toFixed(1) : '—'} /><Metric label="Защита" value={hasSquad ? ratings.defense.toFixed(1) : '—'} />
      </div>

      <div className="overflow-x-auto mt-4 rounded border border-line">
        {hasSquad ? (
          <table className="tbl w-full text-sm min-w-[30rem]">
            <THead>
              <th className="px-2 py-2 text-left text-[11px] uppercase tracking-wider font-semibold">Поз.</th>
              <th className="px-2 py-2 text-left text-[11px] uppercase tracking-wider font-semibold">Игрок</th>
              <th className="px-2 py-2 text-right text-[11px] uppercase tracking-wider font-semibold">OVR</th>
              <th className="px-2 py-2 text-right text-[11px] uppercase tracking-wider font-semibold">М · Г · MVP</th>
              <th className="px-2 py-2 text-right text-[11px] uppercase tracking-wider font-semibold">Действия</th>
            </THead>
            <tbody>
              {squad.map((p) =>
                editingId === p.id ? (
                  <PlayerEditRow key={p.id} player={p} db={db} act={act} onDone={() => setEditingId(null)} />
                ) : (
                  <tr key={p.id} className="border-b border-line last:border-0">
                    <td className="px-2 py-2"><PosChip pos={p.pos} /></td>
                    <td className="px-2 py-2"><span className="inline-flex items-baseline gap-2"><span className="text-mute text-xs num w-5 text-right">{p.number || ''}</span><PlayerLink id={p.id} name={p.name} /></span></td>
                    <td className="px-2 py-2 text-right num">{p.ovr}</td>
                    <td className="px-2 py-2 text-right text-mute num">{p.stats.apps} · {p.stats.goals} · {p.stats.motm}</td>
                    <td className="px-2 py-2">
                      <div className="flex justify-end gap-1 flex-wrap">
                        <button type="button" className={btn('ghost', 'sm')} onClick={() => setEditingId(p.id)}>Изменить</button>
                        <ConfirmButton size="sm" label="Свободный" confirmLabel="Точно?" onConfirm={() => act.makeFreeAgent(p.id)} />
                        <ConfirmButton size="sm" label="Завершить" confirmLabel="Точно?" onConfirm={() => act.retirePlayer(p.id)} />
                        <ConfirmButton size="sm" label="Удалить" confirmLabel="Точно?" onConfirm={() => act.deletePlayer(p.id)} />
                      </div>
                    </td>
                  </tr>
                )
              )}
            </tbody>
          </table>
        ) : <Empty>В клубе пока нет игроков. Добавьте через вкладку «Все игроки».</Empty>}
      </div>
    </Panel>
  );
}
