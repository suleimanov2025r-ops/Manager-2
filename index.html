const COUNTRY_FLAG = (db, countryId) => db.nationalTeams.find((x) => x.id === countryId) || null;

function AggTable({ head, rows }) {
  return (
    <div className="overflow-x-auto rounded border border-line">
      <table className="tbl w-full text-sm min-w-[26rem]">
        <THead>
          {head.map((h) => <th key={h} className="px-2 py-2 text-left text-[11px] uppercase tracking-wider font-semibold">{h}</th>)}
          {['М', 'Г', 'MVP', 'ХТ', 'ПК', '5+'].map((h) => (
            <th key={h} className="px-2 py-2 text-center text-[11px] uppercase tracking-wider font-semibold w-10">{h}</th>
          ))}
        </THead>
        <tbody>
          {rows.map((r) => (
            <tr key={r.key} className="border-b border-line last:border-0 even:bg-surf2">
              {r.cells.map((c, i) => <td key={i} className="px-2 py-2">{c}</td>)}
              <td className="px-2 py-2 text-center num w-10">{r.agg.apps}</td>
              <td className="px-2 py-2 text-center num font-semibold w-10">{r.agg.goals}</td>
              <td className="px-2 py-2 text-center num w-10">{r.agg.motm}</td>
              <td className="px-2 py-2 text-center num w-10">{r.agg.hatTricks}</td>
              <td className="px-2 py-2 text-center num w-10">{r.agg.pokers}</td>
              <td className="px-2 py-2 text-center num w-10">{r.agg.fivePlus}</td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function PlayerProfile({ playerId, db, onBack, act }) {
  const nav = useContext(NavCtx);
  const player = db.players.find((p) => p.id === playerId) || null;
  const [season, setSeason] = useState('');
  const [tid, setTid] = useState('');
  const [logLimit, setLogLimit] = useState(15);

  const log = useMemo(() => playerLog(db.matches, playerId), [db.matches, playerId]);
  const filtered = useMemo(
    () => log.filter((x) => (!season || x.m.season === Number(season)) && (!tid || x.m.tournamentId === tid)),
    [log, season, tid]
  );
  const seasonOptions = useMemo(() => [...new Set(log.map((x) => x.m.season))].sort((a, b) => b - a), [log]);
  const tournamentOptions = useMemo(() => {
    const map = new Map();
    log.forEach((x) => {
      if (season && x.m.season !== Number(season)) return;
      if (!map.has(x.m.tournamentId)) map.set(x.m.tournamentId, x.m.tournamentName);
    });
    return [...map.entries()];
  }, [log, season]);

  const agg = useMemo(() => {
    const a = emptyAgg();
    filtered.forEach(({ m, e }) => addToAgg(a, e, m.motmId === e.id));
    return a;
  }, [filtered]);
  const aggAll = useMemo(() => {
    const a = emptyAgg();
    log.forEach(({ m, e }) => addToAgg(a, e, m.motmId === e.id));
    return a;
  }, [log]);
  
  const byTournament = useMemo(() => {
    const map = new Map();
    filtered.forEach(({ m, e, side }) => {
      const r = map.get(m.tournamentId) || { key: m.tournamentId, season: m.season, name: m.tournamentName, agg: emptyAgg() };
      if (!r.clubId) r.clubId = side === 'home' ? m.homeId : m.awayId;
      addToAgg(r.agg, e, m.motmId === e.id);
      map.set(m.tournamentId, r);
    });
    return [...map.values()];
  }, [filtered]);

  const bySeason = useMemo(() => {
    const map = new Map();
    filtered.forEach(({ m, e, side }) => {
      const r = map.get(m.season) || { key: String(m.season), season: m.season, agg: emptyAgg() };
      if (!r.clubId) r.clubId = side === 'home' ? m.homeId : m.awayId;
      addToAgg(r.agg, e, m.motmId === e.id);
      map.set(m.season, r);
    });
    return [...map.values()];
  }, [filtered]);

  const moves = useMemo(() => db.transfers.filter((t) => t.playerId === playerId), [db.transfers, playerId]);

  const clubLog = useMemo(() => log.filter((x) => !x.m.national), [log]);
  const nationalLog = useMemo(() => log.filter((x) => x.m.national), [log]);
  const clubAgg = useMemo(() => { const a = emptyAgg(); clubLog.forEach(({ m, e }) => addToAgg(a, e, m.motmId === e.id)); return a; }, [clubLog]);
  const nationalAgg = useMemo(() => { const a = emptyAgg(); nationalLog.forEach(({ m, e }) => addToAgg(a, e, m.motmId === e.id)); return a; }, [nationalLog]);

  if (!player) {
    return (
      <div className="space-y-4">
        <button type="button" className={btn('ghost')} onClick={onBack}>← Назад</button>
        <Panel><Empty>Игрок удалён из базы. Его матчи остались в архиве.</Empty></Panel>
      </div>
    );
  }

  const noFilter = !season && !tid;
  const summary = noFilter ? { ...player.stats } : agg;
  const club = db.clubs.find((c) => c.id === player.clubId);
  const country = COUNTRY_FLAG(db, player.countryId);
  const awardCount = db.awards.filter((a) => a.playerId === playerId).length;
  const isFree = !player.clubId && !player.retired;
  const isRetired = !!player.retired;

  const matchIcons = (e, m) => {
    const goals = e.goals || 0;
    const isMotm = m.motmId === e.id;
    if (goals === 0 && !isMotm) return <span className="text-bad text-base leading-none">❌</span>;
    return (
      <span className="inline-flex items-center gap-0.5">
        {Array.from({ length: goals }).map((_, i) => <span key={i} className="text-base leading-none">⚽</span>)}
        {isMotm && <span className="text-base leading-none">⭐</span>}
      </span>
    );
  };

  return (
    <div className="space-y-4">
      <button type="button" className={btn('ghost')} onClick={onBack}>← Назад</button>

      <div className="bg-navy text-navyink rounded overflow-hidden" style={{ borderBottom: '3px solid var(--cyan)' }}>
        <div className="p-4 sm:p-6 flex flex-wrap items-center gap-4 sm:gap-6">
          <div className="font-display text-7xl sm:text-8xl font-extrabold num leading-none" style={{ opacity: 0.35 }}>{player.number || '–'}</div>
          <div className="min-w-0 flex-1 basis-56">
            <div className="text-xs uppercase tracking-wider opacity-80">{POS_NAME[player.pos]}{player.age ? ` · ${player.age} лет` : ''}</div>
            <h1 className="font-display text-4xl sm:text-5xl font-extrabold uppercase leading-none break-words mt-1">{player.name}</h1>
            {awardCount > 0 && (
              <div className="inline-block mt-2 rounded-sm px-2 py-0.5 text-xs font-bold uppercase tracking-wider" style={{ background: 'var(--yellow)', color: '#0A1233' }}>Золотой мяч{awardCount > 1 ? ` ×${awardCount}` : ''}</div>
            )}
            {isRetired && <div className="inline-block mt-2 rounded-sm px-2 py-0.5 text-xs font-bold uppercase tracking-wider" style={{ background: 'var(--mute)', color: '#FFFFFF' }}>Завершил карьеру</div>}
            {isFree && <div className="inline-block mt-2 rounded-sm px-2 py-0.5 text-xs font-bold uppercase tracking-wider" style={{ background: 'var(--cyan)', color: '#041033' }}>Свободный агент</div>}
            <div className="mt-2 text-sm flex flex-wrap items-center gap-3">
              {club ? <span className="inline-flex items-center gap-2"><ClubLogo id={club.id} name={club.name} size={28} /><ClubLink id={club.id} name={club.name} className="underline underline-offset-4 !text-navyink" /></span> : <span>Без клуба</span>}
              {country && <span className="inline-flex items-center gap-2"><Logo src={country.logo} name={country.name} size={24} /><span>{country.name}</span></span>}
            </div>
          </div>
          <div className="text-center border rounded px-4 py-2" style={{ borderColor: 'rgba(255,255,255,0.35)' }}>
            <div className="mb-1"><OvrBadge ovr={player.ovr} /></div>
            <div className="text-[11px] uppercase tracking-wider opacity-80 mt-1">OVR</div>
          </div>
        </div>
        <div className="px-4 sm:px-6 pb-4 flex flex-wrap gap-2">
          {isRetired ? (
            <button type="button" className={btn('primary', 'sm')} onClick={() => act.resumeCareer(player.id)}>Возобновить карьеру</button>
          ) : (
            <>
              {isFree && <button type="button" className={btn('primary', 'sm')} onClick={() => nav.openClubPicker(player.id)}>Подписать в клуб</button>}
              {!isFree && club && <ConfirmButton size="sm" label="Сделать свободным агентом" confirmLabel="Убрать из клуба" onConfirm={() => act.makeFreeAgent(player.id)} />}
              <ConfirmButton size="sm" label="Завершить карьеру" confirmLabel="Завершить карьеру?" onConfirm={() => act.retirePlayer(player.id)} />
            </>
          )}
        </div>
      </div>

      <Panel>
        <div className="flex flex-wrap items-end gap-3 mb-4">
          <div className="min-w-0 basis-40">
            <label className={labelCls} htmlFor="pp-season">Сезон</label>
            <select id="pp-season" className={inputCls} value={season} onChange={(e) => { setSeason(e.target.value); setTid(''); setLogLimit(15); }}>
              <option value="">Все сезоны</option>
              {seasonOptions.map((s) => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div className="min-w-0 basis-56 flex-1">
            <label className={labelCls} htmlFor="pp-tid">Турнир</label>
            <select id="pp-tid" className={inputCls} value={tid} onChange={(e) => { setTid(e.target.value); setLogLimit(15); }}>
              <option value="">Все турниры</option>
              {tournamentOptions.map(([id, name]) => <option key={id} value={id}>{name}</option>)}
            </select>
          </div>
        </div>
        <div className="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-6 gap-4">
          <Metric label="Матчи" value={summary.apps} />
          <Metric label="Голы" value={summary.goals} />
          <Metric label="MVP" value={summary.motm} />
          <Metric label="Хет-трики" value={summary.hatTricks} />
          <Metric label="Покеры" value={summary.pokers} />
          <Metric label="5+ голов" value={summary.fivePlus} />
        </div>
      </Panel>

      <div className="grid sm:grid-cols-2 gap-4">
        <Panel>
          <Heading className="mb-3">Клубная карьера</Heading>
          <div className="grid grid-cols-3 gap-3">
            <Metric label="Матчи" value={clubAgg.apps} />
            <Metric label="Голы" value={clubAgg.goals} />
            <Metric label="MVP" value={clubAgg.motm} />
            <Metric label="Хет-трики" value={clubAgg.hatTricks} />
            <Metric label="Покеры" value={clubAgg.pokers} />
            <Metric label="5+ голов" value={clubAgg.fivePlus} />
          </div>
        </Panel>
        <Panel>
          <Heading className="mb-3">Сборная (World Cup)</Heading>
          <div className="grid grid-cols-3 gap-3">
            <Metric label="Матчи" value={nationalAgg.apps} />
            <Metric label="Голы" value={nationalAgg.goals} />
            <Metric label="MVP" value={nationalAgg.motm} />
            <Metric label="Хет-трики" value={nationalAgg.hatTricks} />
            <Metric label="Покеры" value={nationalAgg.pokers} />
            <Metric label="5+ голов" value={nationalAgg.fivePlus} />
          </div>
        </Panel>
      </div>

      <div className="grid lg:grid-cols-2 gap-4 items-start">
        <Panel>
          <Heading className="mb-3">По турнирам</Heading>
          {byTournament.length === 0 ? <Empty>Нет матчей в выбранном периоде.</Empty> : (
            <AggTable 
              head={['Сезон', 'Турнир']}
              rows={byTournament.map((r) => ({ 
                key: r.key, 
                agg: r.agg, 
                cells: [
                  <span className="num">{r.season}</span>, 
                  <span className="inline-flex items-center gap-2">
                    <Logo src={nav.tournamentLogo(r.key)} name={r.name} size={20} />
                    <span>
                      <span className="font-semibold break-words">{r.name}</span>
                    </span>
                  </span>
                ] 
              }))} 
            />
          )}
        </Panel>
        <Panel>
          <Heading className="mb-3">По сезонам</Heading>
          {bySeason.length === 0 ? <Empty>Нет матчей в выбранном периоде.</Empty> : (
            <AggTable 
              head={['Сезон']} 
              rows={bySeason.map((r) => ({ 
                key: r.key, 
                agg: r.agg, 
                cells: [
                  <span className="inline-flex items-center gap-2 font-semibold">
                    <span className="num">{r.season}</span>
                    <Logo src={nav.tournamentLogo(r.clubId)} name="" size={20} />
                  </span>
                ] 
              }))} 
            />
          )}
        </Panel>
      </div>

      <Panel>
        <Heading className="mb-3">Матчи</Heading>
        {filtered.length === 0 ? <Empty>Игрок ещё не выходил на поле в выбранном периоде.</Empty> : (
          <ul className="divide-y divide-line border border-line rounded">
            {filtered.slice(0, logLimit).map(({ m, e, side }) => {
              const own = side === 'home' ? m.hg : m.ag;
              const opp = side === 'home' ? m.ag : m.hg;
              const res = own > opp ? 'W' : own === opp ? 'D' : 'L';
              return (
                <li key={m.id}>
                  <button type="button" onClick={() => nav.openMatch(m.id)} className="w-full text-left px-3 py-2.5 hover:bg-surf2 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-acc">
                    <div className="flex items-start gap-x-3 gap-y-1">
                      <span className="inline-flex items-center justify-center w-5 h-5 rounded-sm text-[10px] font-bold shrink-0 mt-1" style={{ background: FORM_BG[res], color: res === 'D' ? 'var(--surf)' : '#FFFFFF' }}>{FORM_LABEL[res]}</span>
                      <div className="min-w-0 flex-1">
                        <div className="flex items-center flex-wrap gap-1">
                          <ClubLogo id={m.homeId} name="" size={18} /> 
                          <span className="font-semibold">{m.homeName} <span className="num">{m.hg}:{m.ag}</span> {m.awayName}</span>
                          <ClubLogo id={m.awayId} name="" size={18} />
                        </div>
                        {m.pens && <span className="text-xs text-mute"> (пен. {m.pens.h}:{m.pens.a})</span>}
                        <span className="block text-xs text-mute mt-0.5">{m.tournamentName} · {m.stage} · {m.season}</span>
                        <div className="mt-1">{matchIcons(e, m)}</div>
                      </div>
                    </div>
                  </button>
                </li>
              );
            })}
          </ul>
        )}
        {filtered.length > logLimit && (
          <div className="mt-3 flex justify-center">
            <button type="button" className={btn('ghost')} onClick={() => setLogLimit(logLimit + 15)}>Показать ещё ({filtered.length - logLimit})</button>
          </div>
        )}
      </Panel>

      {moves.length > 0 && (
        <Panel>
          <Heading className="mb-3">Карьера: переходы</Heading>
          <ul className="divide-y divide-line">
            {[...moves].reverse().map((t) => (
              <li key={t.id} className="py-2 text-sm flex flex-wrap items-baseline justify-between gap-2">
                <span>{t.fromName} → <span className="font-semibold">{t.toName}</span></span>
                <span className="text-mute num">сезон {t.season || START_SEASON}</span>
              </li>
            ))}
          </ul>
        </Panel>
      )}
    </div>
  );
}

function ClubPickerModal({ playerId, db, act, onClose }) {
  const player = db.players.find((p) => p.id === playerId);
  const [clubId, setClubId] = useState('');
  if (!player) return null;
  const club = db.clubs.find((c) => c.id === clubId);
  const confirm = () => { if (!clubId) return; act.signFreeAgent(player.id, clubId); onClose(); };
  return (
    <div className="modal-back" onClick={onClose} role="dialog" aria-modal="true" aria-label="Подписать в клуб">
      <div className="modal-panel max-w-md" onClick={(e) => e.stopPropagation()}>
        <div className="bg-navy text-navyink p-4 flex items-center justify-between gap-3">
          <h2 className="font-display text-2xl font-bold uppercase tracking-wider">Подписать в клуб</h2>
          <button type="button" onClick={onClose} className="btn-navy rounded px-2.5 py-1 text-xs font-semibold">Закрыть</button>
        </div>
        <div className="p-4 space-y-4">
          <p className="text-sm">Игрок: <b>{player.name}</b> · {POS_NAME[player.pos]} · OVR {player.ovr}</p>
          <div>
            <label className={labelCls} htmlFor="fa-club">Клуб</label>
            <select id="fa-club" className={inputCls} value={clubId} onChange={(e) => setClubId(e.target.value)}>
              <option value="">Выберите клуб</option>
              {db.clubs.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>
          <button type="button" className={`${btn('primary')} w-full`} disabled={!clubId} onClick={confirm}>
            {club ? `Подписать в «${club.name}»` : 'Подписать'}
          </button>
        </div>
      </div>
    </div>
  );
}

function ClubProfile({ club, db }) {
  const nav = useContext(NavCtx);
  const [squadTab, setSquadTab] = useState('all');

  const ms = useMemo(() => db.matches.filter((m) => !m.national && (m.homeId === club.id || m.awayId === club.id)), [db.matches, club.id]);
  const rec = useMemo(() => clubRecord(ms, club.id), [ms, club.id]);
  const form = useMemo(() => clubForm(ms, club.id, 5), [ms, club.id]);
  const honours = useMemo(() => db.honours.filter((h) => h.clubId === club.id && !h.national), [db.honours, club.id]);
  const leagueTitles = honours.filter((h) => h.type === 'league').length;
  const nationalCups = honours.filter((h) => h.type === 'cup' && !/champions/i.test(h.tournamentName)).length;
  const uclTitles = honours.filter((h) => /champions/i.test(h.tournamentName)).length;
  
  const squad = useMemo(() => squadOf(db.players, club.id), [db.players, club.id]);
  const ratings = teamRatings(squad);

  const seasonRows = useMemo(() => {
    const map = new Map();
    ms.forEach((m) => { if (!map.has(m.season)) map.set(m.season, []); map.get(m.season).push(m); });
    return [...map.entries()].sort((a, b) => b[0] - a[0]).map(([season, list]) => ({ season, r: clubRecord(list, club.id), trophies: honours.filter((h) => h.season === season).length }));
  }, [ms, honours, club.id]);

  const tournamentRows = useMemo(() => {
    const rows = [];
    db.tournaments.forEach((t) => {
      if (t.national) return;
      t.editions.forEach((e) => {
        if (!e.teams.some((x) => x.id === club.id)) return;
        let result;
        if (t.type === 'league') {
          const table = leagueTable(e);
          const pos = table.findIndex((r) => r.id === club.id) + 1;
          result = `${pos} место из ${table.length}${e.status === 'finished' && e.championId === club.id ? ' · чемпион' : ''}`;
        } else {
          result = cupResult(t, e, club.id);
        }
        rows.push({ t, e, result });
      });
    });
    return rows.sort((a, b) => b.e.season - a.e.season);
  }, [db.tournaments, club.id]);

  const rows = useMemo(() => {
    const map = aggregateMatches(db.matches.filter((m) => !m.national), null, (e) => e.clubId === club.id);
    const out = Object.values(map).map((r) => {
      const live = db.players.find((p) => p.id === r.id);
      return {
        ...r,
        name: live ? live.name : r.name, pos: live ? live.pos : r.pos, ovr: live ? live.ovr : r.ovr,
        number: live ? live.number : r.number, clubName: club.name,
        former: !live || live.clubId !== club.id || live.retired
      };
    });
    squad.forEach((p) => {
      if (!map[p.id]) out.push({ id: p.id, name: p.name, pos: p.pos, ovr: p.ovr, number: p.number, clubId: club.id, clubName: club.name, former: false, s: emptyAgg() });
    });
    return out;
  }, [db.matches, db.players, club.id, club.name, squad]);

  const tabRows = squadTab === 'all' ? rows : rows.filter((r) => r.pos === squadTab);
  const tabSort = { all: 'goals', GK: 'motm', DEF: 'motm', MID: 'goals', FWD: 'goals' }[squadTab];
  const tabs = [['all', 'Все'], ...POSITIONS.map((p) => [p, POS_PLURAL[p]])];
  const recent = [...ms].reverse().slice(0, 6);

  const topScorers = useMemo(() => [...rows].sort((a, b) => b.s.goals - a.s.goals || b.s.motm - a.s.motm).slice(0, 5), [rows]);
  const topMvp = useMemo(() => [...rows].sort((a, b) => b.s.motm - a.s.motm || b.s.goals - a.s.goals).slice(0, 5), [rows]);

  return (
    <div className="space-y-4">
      <div className="bg-navy text-navyink rounded overflow-hidden" style={{ borderBottom: '3px solid var(--cyan)' }}>
        <div className="p-4 sm:p-6 flex flex-wrap items-center gap-4 sm:gap-6">
          <ClubLogo id={club.id} name={club.name} size={88} />
          <div className="min-w-0 flex-1 basis-64">
            <div className="text-xs uppercase tracking-wider opacity-80">Профиль клуба · сезон {db.season}</div>
            <h1 className="font-display text-4xl sm:text-5xl font-extrabold uppercase leading-none break-words mt-1">{club.name}</h1>
            <div className="mt-3 flex items-center gap-3 text-sm"><span className="opacity-80">Форма</span><FormDots form={form} /></div>
          </div>
          <div className="grid grid-cols-3 gap-3">
            {[['OVR', squad.length ? ratings.overall.toFixed(1) : '—'], ['Атака', squad.length ? ratings.attack.toFixed(1) : '—'], ['Защита', squad.length ? ratings.defense.toFixed(1) : '—']].map(([k, v]) => (
              <div key={k} className="text-center border rounded px-3 py-2" style={{ borderColor: 'rgba(255,255,255,0.35)' }}>
                <div className="font-display text-3xl font-bold num leading-none">{v}</div>
                <div className="text-[11px] uppercase tracking-wider opacity-80 mt-1">{k}</div>
              </div>
            ))}
          </div>
        </div>
      </div>

      <Panel>
        <Heading className="mb-4">История клуба</Heading>
        <div className="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-8 gap-4">
          <Metric label="Матчи" value={rec.p} /><Metric label="Победы" value={rec.w} /><Metric label="Ничьи" value={rec.d} />
          <Metric label="Поражения" value={rec.l} /><Metric label="Забито" value={rec.gf} /><Metric label="Пропущено" value={rec.ga} />
          <Metric label="Разница">{rec.gf - rec.ga > 0 ? '+' : ''}{rec.gf - rec.ga}</Metric>
          <Metric label="% побед">{rec.p ? `${Math.round((rec.w / rec.p) * 100)}%` : '—'}</Metric>
        </div>
      </Panel>

      <div className="grid lg:grid-cols-2 gap-4 items-start">
        <Panel>
          <Heading className="mb-3">Трофеи</Heading>
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-4 mb-3">
            <Metric label="Всего" value={honours.length} />
            <Metric label="Чемпионаты" value={leagueTitles} />
            <Metric label="Кубки" value={nationalCups} />
            <Metric label="Лига Чемпионов" value={uclTitles} />
          </div>
          {honours.length === 0 ? <Empty>Трофеев пока нет.</Empty> : (
            <ul className="divide-y divide-line border border-line rounded">
              {[...honours].reverse().map((h) => (
                <li key={h.id} className="px-3 py-2 flex items-center justify-between gap-3 text-sm">
                  <span className="min-w-0 flex items-center gap-2 break-words font-semibold">
                    <Logo src={nav.tournamentLogo(h.tournamentId) || h.logo} name={h.tournamentName} size={24} />
                    {h.tournamentName}
                  </span>
                  <span className="flex items-center gap-2 shrink-0 text-xs text-mute">
                    <span className="uppercase tracking-wider border border-line rounded-sm px-1">{h.type === 'league' ? 'Лига' : 'Кубок'}</span>
                    <span className="num">{h.season}</span>
                  </span>
                </li>
              ))}
            </ul>
          )}
        </Panel>
        <Panel>
          <Heading className="mb-3">Последние матчи</Heading>
          {recent.length === 0 ? <Empty>Клуб ещё не играл матчей.</Empty> : (
            <ul className="divide-y divide-line border border-line rounded">
              {recent.map((m) => {
                const home = m.homeId === club.id;
                const gf = home ? m.hg : m.ag, ga = home ? m.ag : m.hg;
                const res = gf > ga ? 'W' : gf === ga ? 'D' : 'L';
                return (
                  <li key={m.id}>
                    <button type="button" onClick={() => nav.openMatch(m.id)} className="w-full text-left px-3 py-2 flex items-center gap-3 hover:bg-surf2 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-acc">
                      <span className="inline-flex items-center justify-center w-5 h-5 rounded-sm text-[10px] font-bold shrink-0" style={{ background: FORM_BG[res], color: res === 'D' ? 'var(--surf)' : '#FFFFFF' }}>{FORM_LABEL[res]}</span>
                      <span className="min-w-0 flex-1 text-sm break-words">
                        <span className="font-semibold inline-flex items-center flex-wrap gap-1">
                          <ClubLogo id={m.homeId} name="" size={18} /> {m.homeName} <span className="num">{m.hg}:{m.ag}</span> {m.awayName} <ClubLogo id={m.awayId} name="" size={18} />
                        </span>
                        {m.pens && <span className="text-xs text-mute"> (пен. {m.pens.h}:{m.pens.a})</span>}
                        <span className="block text-xs text-mute">{m.tournamentName} · {m.stage} · {m.season}</span>
                      </span>
                    </button>
                  </li>
                );
              })}
            </ul>
          )}
        </Panel>
      </div>

      <div className="grid lg:grid-cols-2 gap-4 items-start">
        <Panel>
          <Heading className="mb-3">По сезонам</Heading>
          {seasonRows.length === 0 ? <Empty>Нет сыгранных матчей.</Empty> : (
            <div className="overflow-x-auto rounded border border-line">
              <table className="tbl w-full text-sm min-w-[28rem]">
                <THead>{['Сезон', 'М', 'В', 'Н', 'П', 'З–П', 'О', 'Трофеи'].map((h, i) => (
                  <th key={h} className={`px-2 py-2 text-[11px] uppercase tracking-wider font-semibold ${i === 0 ? 'text-left' : 'text-right'}`}>{h}</th>
                ))}</THead>
                <tbody>
                  {seasonRows.map((s) => (
                    <tr key={s.season} className="border-b border-line last:border-0 even:bg-surf2">
                      <td className="px-2 py-2 font-semibold num">{s.season}</td>
                      <td className="px-2 py-2 text-right num">{s.r.p}</td><td className="px-2 py-2 text-right num">{s.r.w}</td>
                      <td className="px-2 py-2 text-right num">{s.r.d}</td><td className="px-2 py-2 text-right num">{s.r.l}</td>
                      <td className="px-2 py-2 text-right num">{s.r.gf}–{s.r.ga}</td>
                      <td className="px-2 py-2 text-right num font-semibold">{s.r.pts}</td>
                      <td className="px-2 py-2 text-right num">{s.trophies}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </Panel>
        <Panel>
          <Heading className="mb-3">Турниры клуба</Heading>
          {tournamentRows.length === 0 ? <Empty>Клуб не участвовал в турнирах.</Empty> : (
            <ul className="divide-y divide-line border border-line rounded max-h-80 overflow-y-auto">
              {tournamentRows.map(({ t, e, result }) => (
                <li key={`${t.id}-${e.id}`} className="px-3 py-2 text-sm flex flex-wrap items-baseline justify-between gap-2">
                  <span className="min-w-0 break-words"><span className="font-semibold">{t.name}</span><span className="text-xs text-mute"> · {t.type === 'league' ? 'Лига' : 'Кубок'} · {e.season}</span></span>
                  <span className="text-xs text-mute">{result}</span>
                </li>
              ))}
            </ul>
          )}
        </Panel>
      </div>

      <div className="grid lg:grid-cols-2 gap-4 items-start">
        <Panel>
          <Heading className="mb-3">Лучшие бомбардиры клуба</Heading>
          {topScorers.length === 0 ? <Empty>Нет данных.</Empty> : (
            <ol className="divide-y divide-line border border-line rounded">
              {topScorers.map((r, i) => (
                <li key={r.id} className="px-3 py-2 flex items-center gap-2 text-sm">
                  <span className="text-mute num w-4">{i + 1}</span><PosChip pos={r.pos} />
                  <span className="min-w-0 flex-1 break-words"><PlayerLink id={r.id} name={r.name} /></span>
                  <span className="font-display text-xl font-bold num">{r.s.goals}</span>
                </li>
              ))}
            </ol>
          )}
        </Panel>
        <Panel>
          <Heading className="mb-3">Лучшие по MVP</Heading>
          {topMvp.length === 0 ? <Empty>Нет данных.</Empty> : (
            <ol className="divide-y divide-line border border-line rounded">
              {topMvp.map((r, i) => (
                <li key={r.id} className="px-3 py-2 flex items-center gap-2 text-sm">
                  <span className="text-mute num w-4">{i + 1}</span><PosChip pos={r.pos} />
                  <span className="min-w-0 flex-1 break-words"><PlayerLink id={r.id} name={r.name} /></span>
                  <span className="font-display text-xl font-bold num">{r.s.motm}</span>
                </li>
              ))}
            </ol>
          )}
        </Panel>
      </div>

      <Panel>
        <Heading className="mb-3">Все игроки клуба</Heading>
        <p className="text-sm text-mute mb-3">Статистика считается по матчам за этот клуб. Бывшие игроки остаются в списке. Матчи сборной не входят.</p>
        <div className="flex flex-wrap gap-2 mb-4" role="tablist" aria-label="Позиции">
          {tabs.map(([key, label]) => (
            <button key={key} type="button" role="tab" aria-selected={squadTab === key} onClick={() => setSquadTab(key)}
              className={`${btn('ghost', 'sm')} ${squadTab === key ? '!bg-btn !text-btnink !border-transparent' : ''}`}>{label}</button>
          ))}
        </div>
        <PlayerTable key={squadTab} rows={tabRows} defaultSort={tabSort} emptyText="На этой позиции нет игроков." />
      </Panel>
    </div>
  );
}

function ClubsTab({ db, clubId, onSelect }) {
  const sorted = useMemo(() => [...db.clubs].sort((a, b) => a.name.localeCompare(b.name, 'ru')), [db.clubs]);
  const club = db.clubs.find((c) => c.id === clubId) || sorted[0] || null;
  if (!club) return <Panel><Empty>Клубов нет. Создайте первый на вкладке «База».</Empty></Panel>;
  return (
    <div className="space-y-4">
      <div className="max-w-md">
        <label className={labelCls} htmlFor="club-pick">Клуб</label>
        <select id="club-pick" className={inputCls} value={club.id} onChange={(e) => onSelect(e.target.value)}>
          {sorted.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
        </select>
      </div>
      <ClubProfile key={club.id} club={club} db={db} />
    </div>
  );
}

function NationalTeamProfile({ country, db }) {
  const nav = useContext(NavCtx);
  const [season, setSeason] = useState('');
  const ms = useMemo(() => db.matches.filter((m) => m.national && (m.homeId === country.id || m.awayId === country.id)), [db.matches, country.id]);
  const seasons = useMemo(() => [...new Set(ms.map((m) => m.season))].sort((a, b) => b - a), [ms]);
  const filtered = useMemo(() => (season ? ms.filter((m) => m.season === Number(season)) : ms), [ms, season]);
  const rec = useMemo(() => clubRecord(filtered, country.id), [filtered, country.id]);
  const form = useMemo(() => clubForm(filtered, country.id, 5), [filtered, country.id]);

  const playerRows = useMemo(() => {
    const map = aggregateMatches(filtered, (m) => m.national);
    return Object.values(map).map((r) => {
      const live = db.players.find((p) => p.id === r.id);
      return live ? { ...r, name: live.name, pos: live.pos, ovr: live.ovr, number: live.number } : r;
    });
  }, [filtered, db.players]);

  const scorers = useMemo(() => [...playerRows].sort((a, b) => b.s.goals - a.s.goals || b.s.motm - a.s.motm).slice(0, 10), [playerRows]);
  const mvps = useMemo(() => [...playerRows].sort((a, b) => b.s.motm - a.s.motm || b.s.goals - a.s.goals).slice(0, 10), [playerRows]);
  const hatTricks = useMemo(() => [...playerRows].filter((r) => r.s.hatTricks + r.s.pokers + r.s.fivePlus > 0)
    .sort((a, b) => (b.s.hatTricks + b.s.pokers + b.s.fivePlus) - (a.s.hatTricks + a.s.pokers + a.s.fivePlus)), [playerRows]);

  const squad = useMemo(() => db.players.filter((p) => p.countryId === country.id && !p.retired), [db.players, country.id]);
  const honours = useMemo(() => db.honours.filter((h) => h.clubId === country.id && h.national), [db.honours, country.id]);
  const tournaments = useMemo(() => db.tournaments.filter((t) => t.national && t.editions.some((e) => e.teams.some((tm) => tm.id === country.id))), [db.tournaments, country.id]);

  return (
    <div className="space-y-4">
      <div className="bg-navy text-navyink rounded overflow-hidden" style={{ borderBottom: '3px solid var(--cyan)' }}>
        <div className="p-4 sm:p-6 flex flex-wrap items-center gap-4 sm:gap-6">
          <Logo src={country.logo} name={country.name} size={88} />
          <div className="min-w-0 flex-1 basis-64">
            <div className="text-xs uppercase tracking-wider opacity-80">Сборная · сезон {db.season}</div>
            <h1 className="font-display text-4xl sm:text-5xl font-extrabold uppercase leading-none break-words mt-1">{country.name}</h1>
            <div className="mt-3 flex items-center gap-3 text-sm"><span className="opacity-80">Форма</span><FormDots form={form} /></div>
          </div>
          <div className="grid grid-cols-3 gap-3">
            <div className="text-center border rounded px-3 py-2" style={{ borderColor: 'rgba(255,255,255,0.35)' }}>
              <div className="font-display text-3xl font-bold num leading-none">{squad.length}</div>
              <div className="text-[11px] uppercase tracking-wider opacity-80 mt-1">Игроков</div>
            </div>
            <div className="text-center border rounded px-3 py-2" style={{ borderColor: 'rgba(255,255,255,0.35)' }}>
              <div className="font-display text-3xl font-bold num leading-none">{honours.length}</div>
              <div className="text-[11px] uppercase tracking-wider opacity-80 mt-1">Кубков мира</div>
            </div>
            <div className="text-center border rounded px-3 py-2" style={{ borderColor: 'rgba(255,255,255,0.35)' }}>
              <div className="font-display text-3xl font-bold num leading-none">{rec.p}</div>
              <div className="text-[11px] uppercase tracking-wider opacity-80 mt-1">Матчей</div>
            </div>
          </div>
        </div>
      </div>

      <Panel>
        <div className="flex flex-wrap items-end gap-3 mb-4">
          <div className="min-w-0 basis-40">
            <label className={labelCls} htmlFor="nt-season">Сезон</label>
            <select id="nt-season" className={inputCls} value={season} onChange={(e) => setSeason(e.target.value)}>
              <option value="">Все сезоны</option>
              {seasons.map((s) => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
        </div>
        <div className="grid grid-cols-3 sm:grid-cols-4 lg:grid-cols-8 gap-4">
          <Metric label="Матчи" value={rec.p} /><Metric label="Победы" value={rec.w} /><Metric label="Ничьи" value={rec.d} />
          <Metric label="Поражения" value={rec.l} /><Metric label="Забито" value={rec.gf} /><Metric label="Пропущено" value={rec.ga} />
          <Metric label="Разница">{rec.gf - rec.ga > 0 ? '+' : ''}{rec.gf - rec.ga}</Metric>
          <Metric label="% побед">{rec.p ? `${Math.round((rec.w / rec.p) * 100)}%` : '—'}</Metric>
        </div>
      </Panel>

      <div className="grid lg:grid-cols-2 gap-4 items-start">
        <Panel>
          <Heading className="mb-3">Трофеи</Heading>
          {honours.length === 0 ? <Empty>Побед на ЧМ пока нет.</Empty> : (
            <ul className="divide-y divide-line border border-line rounded">
              {[...honours].reverse().map((h) => (
                <li key={h.id} className="px-3 py-2 flex items-center justify-between gap-3 text-sm">
                  <span className="min-w-0 flex items-center gap-2 break-words font-semibold">
                    <Logo src={nav.tournamentLogo(h.tournamentId) || h.logo} name={h.tournamentName} size={24} />{h.tournamentName}
                  </span>
                  <span className="text-xs text-mute num">сезон {h.season}</span>
                </li>
              ))}
            </ul>
          )}
        </Panel>
        <Panel>
          <Heading className="mb-3">Турниры сборной</Heading>
          {tournaments.length === 0 ? <Empty>Сборная ещё не участвовала в турнирах.</Empty> : (
            <ul className="divide-y divide-line border border-line rounded">
              {tournaments.map((t) => {
                const eds = t.editions.filter((e) => e.teams.some((tm) => tm.id === country.id));
                return eds.map((e) => (
                  <li key={`${t.id}-${e.id}`} className="px-3 py-2 text-sm flex flex-wrap items-baseline justify-between gap-2">
                    <span className="min-w-0 break-words"><span className="font-semibold">{t.name}</span><span className="text-xs text-mute"> · {e.season}</span></span>
                    <span className="text-xs text-mute">{e.status === 'finished' && e.championId === country.id ? 'Победитель' : e.status === 'finished' ? 'Завершён' : 'Идёт'}</span>
                  </li>
                ));
              })}
            </ul>
          )}
        </Panel>
      </div>

      <div className="grid lg:grid-cols-3 gap-4 items-start">
        <Panel>
          <Heading className="mb-3">Бомбардиры</Heading>
          {scorers.length === 0 ? <Empty>Пока нет голов.</Empty> : (
            <ol className="divide-y divide-line border border-line rounded">
              {scorers.map((r, i) => (
                <li key={r.id} className="px-3 py-2 flex items-center gap-2 text-sm">
                  <span className="text-mute num w-4">{i + 1}</span>
                  <span className="min-w-0 flex-1 break-words"><PlayerLink id={r.id} name={r.name} /><span className="block text-xs text-mute">{r.pos}</span></span>
                  <span className="font-display text-xl font-bold num">{r.s.goals}</span>
                </li>
              ))}
            </ol>
          )}
        </Panel>
        <Panel>
          <Heading className="mb-3">MVP</Heading>
          {mvps.length === 0 ? <Empty>Пока нет MVP.</Empty> : (
            <ol className="divide-y divide-line border border-line rounded">
              {mvps.map((r, i) => (
                <li key={r.id} className="px-3 py-2 flex items-center gap-2 text-sm">
                  <span className="text-mute num w-4">{i + 1}</span>
                  <span className="min-w-0 flex-1 break-words"><PlayerLink id={r.id} name={r.name} /><span className="block text-xs text-mute">{r.pos}</span></span>
                  <span className="font-display text-xl font-bold num">{r.s.motm}</span>
                </li>
              ))}
            </ol>
          )}
        </Panel>
        <Panel>
          <Heading className="mb-3">Хет-трики</Heading>
          {hatTricks.length === 0 ? <Empty>Хет-триков пока нет.</Empty> : (
            <ol className="divide-y divide-line border border-line rounded">
              {hatTricks.map((r, i) => (
                <li key={r.id} className="px-3 py-2 flex items-center gap-2 text-sm">
                  <span className="text-mute num w-4">{i + 1}</span>
                  <span className="min-w-0 flex-1 break-words"><PlayerLink id={r.id} name={r.name} /><span className="block text-xs text-mute">{r.pos}</span></span>
                  <span className="font-display text-xl font-bold num">{r.s.hatTricks + r.s.pokers + r.s.fivePlus}</span>
                </li>
              ))}
            </ol>
          )}
        </Panel>
      </div>

      <Panel>
        <Heading className="mb-3">Матчи сборной</Heading>
        {filtered.length === 0 ? <Empty>Сборная ещё не играла матчей.</Empty> : (
          <ul className="divide-y divide-line border border-line rounded">
            {[...filtered].reverse().slice(0, 30).map((m) => {
              const home = m.homeId === country.id;
              const gf = home ? m.hg : m.ag, ga = home ? m.ag : m.hg;
              const res = gf > ga ? 'W' : gf === ga ? 'D' : 'L';
              return (
                <li key={m.id}>
                  <button type="button" onClick={() => nav.openMatch(m.id)} className="w-full text-left px-3 py-2 flex items-center gap-3 hover:bg-surf2 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-acc">
                    <span className="inline-flex items-center justify-center w-5 h-5 rounded-sm text-[10px] font-bold shrink-0" style={{ background: FORM_BG[res], color: res === 'D' ? 'var(--surf)' : '#FFFFFF' }}>{FORM_LABEL[res]}</span>
                    <span className="min-w-0 flex-1 text-sm break-words">
                      <span className="font-semibold inline-flex items-center flex-wrap gap-1">
                        <ClubLogo id={m.homeId} name="" size={18} /> {m.homeName} <span className="num">{m.hg}:{m.ag}</span> {m.awayName} <ClubLogo id={m.awayId} name="" size={18} />
                      </span>
                      {m.pens && <span className="text-xs text-mute"> (пен. {m.pens.h}:{m.pens.a})</span>}
                      <span className="block text-xs text-mute">{m.tournamentName} · {m.stage} · {m.season}</span>
                    </span>
                  </button>
                </li>
              );
            })}
          </ul>
        )}
      </Panel>

      <Panel>
        <Heading className="mb-3">Игроки сборной</Heading>
        <p className="text-sm text-mute mb-3">Статистика по матчам сборной (ЧМ) не входит в клубную статистику игрока.</p>
        <PlayerTable key={`nt-${country.id}`} rows={playerRows.map((r) => ({ ...r, clubName: country.name }))} showClub={false} defaultSort="goals" emptyText="В сборной пока нет матчей." />
      </Panel>
    </div>
  );
}

function NationalTeamsTab({ db, act }) {
  const sorted = useMemo(() => [...db.nationalTeams].sort((a, b) => a.name.localeCompare(b.name, 'ru')), [db.nationalTeams]);
  const [selId, setSelId] = useState(sorted[0] ? sorted[0].id : null);
  const [newName, setNewName] = useState('');
  const [error, setError] = useState('');
  const selected = db.nationalTeams.find((c) => c.id === selId) || sorted[0] || null;

  useEffect(() => {
    if (selected && !db.nationalTeams.find((c) => c.id === selected.id)) setSelId(sorted[0] ? sorted[0].id : null);
  }, [db.nationalTeams, selected, sorted]);

  const create = (e) => {
    e.preventDefault();
    const r = act.addNationalTeam(newName);
    if (r.error) { setError(r.error); return; }
    setError(''); setNewName(''); setSelId(r.id);
  };

  return (
    <div className="grid lg:grid-cols-[18rem_minmax(0,1fr)] gap-4 items-start">
      <div className="space-y-4 min-w-0">
        <Panel>
          <form onSubmit={create}>
            <label className={labelCls} htmlFor="nt-new">Новая сборная</label>
            <div className="flex gap-2">
              <input id="nt-new" className={inputCls} placeholder="Название страны" value={newName} onChange={(e) => setNewName(e.target.value)} />
              <button type="submit" className={`${btn('primary')} shrink-0`}>Создать</button>
            </div>
            {error && <p className="text-xs text-bad mt-2">{error}</p>}

        </Panel>
        <Panel className="!p-0">
          <div className="px-4 py-3 border-b border-line text-[11px] font-semibold uppercase tracking-wider text-mute">Сборные · {db.nationalTeams.length}</div>
          {db.nationalTeams.length === 0 && <Empty>Сборных нет. Создайте первую.</Empty>}
          <ul className="max-h-[28rem] overflow-y-auto">
            {sorted.map((c) => {
              const players = db.players.filter((p) => p.countryId === c.id && !p.retired);
              const active = selected && selected.id === c.id;
              return (
                <li key={c.id} className="border-b border-line last:border-0">
                  <button type="button" onClick={() => setSelId(c.id)}
                    className={`w-full text-left px-4 py-3 flex items-center justify-between gap-3 transition-colors focus:outline-none focus-visible:ring-2 focus-visible:ring-acc ${active ? 'bg-accsoft' : 'hover:bg-surf2'}`}>

                      <span className="min-w-0">
                        <span className="block font-semibold break-words">{c.name}</span>

                      </span>
                    </span>
                  </button>
                </li>
              );
            })}
          </ul>
        </Panel>
      </div>
      <div className="min-w-0">
        {selected ? (
          <div className="space-y-4">
            <Panel>
              <div className="flex flex-wrap items-start justify-between gap-3">
                <h2 className="font-display text-3xl font-bold uppercase tracking-wide break-words">{selected.name}</h2>
                <ConfirmButton size="sm" label="Удалить сборную" confirmLabel="Удалить. Игроки останутся в базе" onConfirm={() => act.deleteNationalTeam(selected.id)} />
              </div>
              <div className="mt-4 pt-4 border-t border-line">
                <LogoField key={selected.id} label="Флаг сборной" name={selected.name} value={selected.logo} onChange={(v) => act.setNationalTeamLogo(selected.id, v)} />
              </div>
            </Panel>
            <NationalTeamProfile key={selected.id} country={selected} db={db} />

        ) : (
          <Panel><Empty>Выберите или создайте сборную.</Empty></Panel>
        )}
      </div>
    </div>
  );
}

function TransfersTab({ db, act }) {
  const [mode, setMode] = useState('club');
  const [fromId, setFromId] = useState('');
  const [playerId, setPlayerId] = useState('');
  const [toId, setToId] = useState('');
  const [freePlayerId, setFreePlayerId] = useState('');
  const [freeToId, setFreeToId] = useState('');

  const fromPlayers = useMemo(() => sortRoster(squadOf(db.players, fromId)), [db.players, fromId]);
  const player = db.players.find((p) => p.id === playerId && p.clubId === fromId) || null;
  const fromClub = db.clubs.find((c) => c.id === fromId);
  const toClub = db.clubs.find((c) => c.id === toId);
  const canGo = !!(player && toClub && toId !== fromId);

  const freePlayers = useMemo(() => db.players.filter((p) => !p.clubId && !p.retired).sort((a, b) => POS_ORDER[a.pos] - POS_ORDER[b.pos] || b.ovr - a.ovr), [db.players]);
  const freePlayer = db.players.find((p) => p.id === freePlayerId) || null;
  const freeToClub = db.clubs.find((c) => c.id === freeToId);

  const confirm = () => { if (!canGo) return; act.transfer(player.id, toId); setPlayerId(''); };
  const confirmFree = () => { if (!freePlayer || !freeToClub) return; act.signFreeAgent(freePlayer.id, freeToClub.id); setFreePlayerId(''); };

  const statLine = (p) => (
    <span className="text-xs text-mute num">{p.stats.apps} М · {p.stats.goals} Г · {p.stats.motm} MVP · {p.stats.hatTricks + p.stats.pokers + p.stats.fivePlus} ХТ</span>

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap gap-2">
        <button type="button" onClick={() => setMode('club')} className={`${btn('ghost')} ${mode === 'club' ? '!bg-btn !text-btnink !border-transparent' : ''}`}>Клуб → Клуб</button>
        <button type="button" onClick={() => setMode('free')} className={`${btn('ghost')} ${mode === 'free' ? '!bg-btn !text-btnink !border-transparent' : ''}`}>Свободные агенты</button>

          <Panel>
            <Heading>Трансфер игрока</Heading>

            <div className="grid gap-4 mt-4">
              <div>
                <label className={labelCls} htmlFor="tr-from">1. Клуб-источник</label>

                  <option value="">Выберите клуб</option>
                  {db.clubs.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </div>
              <div>
                <label className={labelCls} htmlFor="tr-player">2. Игрок</label>
                <select id="tr-player" className={inputCls} value={playerId} disabled={!fromId} onChange={(e) => setPlayerId(e.target.value)}>

                  {fromPlayers.map((p) => <option key={p.id} value={p.id}>{p.pos} · {p.name} · {p.ovr}</option>)}

              </div>
              <div>
                <label className={labelCls} htmlFor="tr-to">3. Клуб-получатель</label>
                <select id="tr-to" className={inputCls} value={toId} onChange={(e) => setToId(e.target.value)}>
                  <option value="">Выберите клуб</option>
                  {db.clubs.filter((c) => c.id !== fromId).map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
                </select>
              </div>
              {player && (
                <div className="border border-line rounded bg-surf2 p-3 fade-in">

                    <PosChip pos={player.pos} />

                  <div className="grid grid-cols-3 sm:grid-cols-6 gap-3">
                    <Metric label="Матчи" value={player.stats.apps} /><Metric label="Голы" value={player.stats.goals} />
                    <Metric label="MVP" value={player.stats.motm} /><Metric label="Хет-трики" value={player.stats.hatTricks} />
                    <Metric label="Покеры" value={player.stats.pokers} /><Metric label="5+ голов" value={player.stats.fivePlus} />
                  </div>

              )}
              <button type="button" className={btn('primary')} disabled={!canGo} onClick={confirm}>Подтвердить трансфер</button>

                  <option value="">{freePlayers.length ? 'Выберите игрока' : 'Нет свободных агентов'}</option>
                  {freePlayers.map((p) => <option key={p.id} value={p.id}>{p.pos} · {p.name} · OVR {p.ovr}</option>)}
                </select>
              </div>
              <div>
                <label className={labelCls} htmlFor="free-to">2. Клуб</label>
                <select id="free-to" className={inputCls} value={freeToId} onChange={(e) => setFreeToId(e.target.value)}>
                  <option value="">Выберите клуб</option>

              </div>
              {freePlayer && (
                <div className="border border-line rounded bg-surf2 p-3 fade-in">
                  <div className="flex items-center gap-2 mb-2 flex-wrap">
                    <PosChip pos={freePlayer.pos} />

            <Heading>Список свободных агентов · {freePlayers.length}</Heading>

function BestXI({ rows }) {
  const picks = useMemo(() => {
    const need = { GK: 1, DEF: 1, MID: 1, FWD: 3 };
    const pool = rows.filter((r) => r.s.apps > 0);
    const sorter = (a, b) => b.s.motm - a.s.motm || b.s.goals - a.s.goals || b.ovr - a.ovr;
    return POSITIONS.map((pos) => ({ pos, list: pool.filter((r) => r.pos === pos).sort(sorter).slice(0, need[pos]) }));
  }, [rows]);
  if (!picks.some((g) => g.list.length)) return <Empty>Нужны сыгранные матчи.</Empty>;
  return (
    <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
      {picks.map((g) => (
        <div key={g.pos} className="border border-line rounded min-w-0">
          <div className="px-3 py-1.5 bg-surf2 text-[11px] font-semibold uppercase tracking-wider text-mute">{POS_PLURAL[g.pos]}</div>
          <ul className="divide-y divide-line">
            {g.list.length === 0 && <li className="px-3 py-2 text-sm text-mute">Нет кандидатов</li>}
            {g.list.map((r) => (
              <li key={r.id} className="px-3 py-2 flex items-center justify-between gap-2 text-sm">
                <span className="min-w-0 break-words"><PlayerLink id={r.id} name={r.name} /><span className="block text-xs text-mute">{r.clubName} · MVP {r.s.motm} · {r.s.goals} Г</span></span>
                <span className="shrink-0 num font-semibold text-xs text-mute">OVR {r.ovr}</span>
              </li>
            ))}
          </ul>
        </div>
      ))}
    </div>
  );
}

function StatsTab({ db }) {
  const [season, setSeason] = useState('');
  const [tid, setTid] = useState('');
  const [query, setQuery] = useState('');
  const [posFilter, setPosFilter] = useState('');
  const [clubFilter, setClubFilter] = useState('');

  const seasons = useMemo(() => seasonsOf(db), [db.matches, db.tournaments, db.season]);
  const tournaments = useMemo(() => {
    const map = new Map();
    db.matches.forEach((m) => {
      if (season && m.season !== Number(season)) return;
      if (!map.has(m.tournamentId)) map.set(m.tournamentId, m.tournamentName);
    });
    return [...map.entries()];
  }, [db.matches, season]);

  const baseRows = useMemo(() => {
    const names = {};
    db.clubs.forEach((c) => { names[c.id] = c.name; });
    db.nationalTeams.forEach((c) => { names[c.id] = c.name; });
    const matchPred = (m) => (!season || m.season === Number(season)) && (!tid || m.tournamentId === tid);
    const map = aggregateMatches(db.matches, matchPred);
    if (!season && !tid) {
      return db.players.map((p) => ({
        id: p.id, name: p.name, pos: p.pos, ovr: p.ovr, number: p.number,
        clubId: p.clubId || null, clubName: p.clubId ? (names[p.clubId] || '—') : (p.countryId ? (names[p.countryId] || '—') : 'Без клуба'),
        s: { ...p.stats }
      }));
    }
    return Object.values(map).map((r) => {
      const live = db.players.find((p) => p.id === r.id);
      return live ? { ...r, name: live.name, pos: live.pos, ovr: live.ovr, number: live.number } : r;
    });
  }, [db.players, db.clubs, db.nationalTeams, db.matches, season, tid]);

  const rows = useMemo(() => {
    const q = query.trim().toLowerCase();
    return baseRows.filter((r) => (!q || r.name.toLowerCase().includes(q)) && (!posFilter || r.pos === posFilter) && (!clubFilter || r.clubId === clubFilter));
  }, [baseRows, query, posFilter, clubFilter]);

  const leaders = useMemo(() => {
    const best = (valueOf) => {
      let top = null;
      baseRows.forEach((r) => {
        if (r.s.apps < 1) return;
        const v = valueOf(r);
        if (v > 0 && (!top || v > top.v)) top = { p: r, v };
      });
      return top ? { p: top.p, value: top.v } : null;
    };
    return { scorer: best((r) => r.s.goals), mvp: best((r) => r.s.motm), hat: best((r) => r.s.hatTricks + r.s.pokers + r.s.fivePlus) };
  }, [baseRows]);

  const scopeLabel = tid ? (tournaments.find((t) => t[0] === tid) || ['', 'турнир'])[1] : season ? `сезон ${season}` : 'всё время';

  return (
    <div className="space-y-4">
      <Panel>
        <div className="flex flex-wrap items-end gap-3">
          <div className="min-w-0 basis-36">
            <label className={labelCls} htmlFor="st-season">Сезон</label>
            <select id="st-season" className={inputCls} value={season} onChange={(e) => { setSeason(e.target.value); setTid(''); }}>
              <option value="">Всё время</option>
              {seasons.map((s) => <option key={s} value={s}>{s}</option>)}
            </select>
          </div>
          <div className="min-w-0 basis-52 flex-1">
            <label className={labelCls} htmlFor="st-tid">Турнир</label>
            <select id="st-tid" className={inputCls} value={tid} onChange={(e) => setTid(e.target.value)}>
              <option value="">Все турниры</option>
              {tournaments.map(([id, name]) => <option key={id} value={id}>{name}</option>)}
            </select>
          </div>
          <div className="min-w-0 flex-1 basis-44">
            <label className={labelCls} htmlFor="st-q">Поиск игрока</label>
            <input id="st-q" className={inputCls} placeholder="Имя" value={query} onChange={(e) => setQuery(e.target.value)} />
          </div>
          <div className="min-w-0 basis-28">
            <label className={labelCls} htmlFor="st-pos">Позиция</label>
            <select id="st-pos" className={inputCls} value={posFilter} onChange={(e) => setPosFilter(e.target.value)}>
              <option value="">Все</option>
              {POSITIONS.map((p) => <option key={p} value={p}>{p}</option>)}
            </select>
          </div>
          <div className="min-w-0 basis-44">
            <label className={labelCls} htmlFor="st-club">Клуб</label>
            <select id="st-club" className={inputCls} value={clubFilter} onChange={(e) => setClubFilter(e.target.value)}>
              <option value="">Все клубы</option>
              {db.clubs.map((c) => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </div>
        </div>
      </Panel>

      <div className="grid sm:grid-cols-3 gap-4">
        <Leader title="Золотая бутса" entry={leaders.scorer} unit="голов" />
        <Leader title="Лучший по MVP" entry={leaders.mvp} unit="наград MVP" />
        <Leader title="Король хет-триков" entry={leaders.hat} unit="крупных матчей" />
      </div>

      <Panel>
        <Heading className="mb-1">Символическая сборная 1‑1‑1‑3</Heading>
        <p className="text-sm text-mute mb-3">Лучшие по MVP, затем по голам, затем по OVR: {scopeLabel}.</p>
        <BestXI rows={baseRows} />
      </Panel>

      <Panel>
        <Heading className="mb-1">Зал славы · {scopeLabel}</Heading>
        <p className="text-sm text-mute mb-3">Матчи | Голы | MVP | Хет-трики | Покеры | 5+ голов. Нажмите на имя, чтобы открыть профиль игрока.</p>
        <PlayerTable key={`${season}|${tid}`} rows={rows} showClub defaultSort="goals" emptyText="Игроки не найдены." />
      </Panel>
    </div>
  );
}

function BallonTab({ db, act }) {
  const seasons = useMemo(() => {
    const s = new Set(db.matches.map((m) => m.season));
    s.add(db.season);
    return [...s].sort((a, b) => b - a);
  }, [db.matches, db.season]);
  const [season, setSeason] = useState(() => seasons.find((s) => db.matches.some((m) => m.season === s)) || db.season);
  const [msg, setMsg] = useState('');
  const [customOrder, setCustomOrder] = useState(null);
  const [replaceIdx, setReplaceIdx] = useState(null);
  const [replaceQuery, setReplaceQuery] = useState('');
  const [manualWinner, setManualWinner] = useState(null);

  const result = useMemo(() => ballonRanking(db, season), [db, season]);
  useEffect(() => { setCustomOrder(null); setManualWinner(null); setMsg(''); }, [season]);

  const nominees = useMemo(() => {
    const top = result.list.slice(0, 5);
    if (!customOrder) return top;
    const byId = new Map(result.list.map((r) => [r.id, r]));
    const ordered = customOrder.map((id) => byId.get(id)).filter(Boolean);
    top.forEach((r) => { if (!customOrder.includes(r.id)) ordered.push(r); });
    return ordered.slice(0, 5);
  }, [result.list, customOrder]);

  const winner = manualWinner ? result.list.find((r) => r.id === manualWinner) : nominees[0];
  const award = db.awards.find((a) => a.season === season);
  const running = db.tournaments.some((t) => t.editions.some((e) => e.season === season && e.status === 'active'));

  const give = () => {
    if (!winner) { setMsg('Нет кандидатов'); return; }
    const r = act.giveAward(season, winner.id);
    setMsg(r.error || '');
  };
  const moveUp = (i) => {
    if (i <= 0) return;
    const arr = nominees.map((r) => r.id);
    [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]];
    setCustomOrder(arr);
  };
  const moveDown = (i) => {
    if (i >= nominees.length - 1) return;
    const arr = nominees.map((r) => r.id);
    [arr[i], arr[i + 1]] = [arr[i + 1], arr[i]];
    setCustomOrder(arr);
  };
  const openReplace = (i) => { setReplaceIdx(i); setReplaceQuery(''); };
  const doReplace = (newId) => {
    if (!newId) return;
    const arr = nominees.map((r) => r.id);
    arr[replaceIdx] = newId;
    setCustomOrder(arr);
    setReplaceIdx(null);
  };

  const allPlayersForReplace = useMemo(() => {
    const q = replaceQuery.trim().toLowerCase();
    return db.players.filter((p) => !p.retired)
      .filter((p) => !q || p.name.toLowerCase().includes(q))
      .map((p) => {
        const live = result.list.find((r) => r.id === p.id);
        return { id: p.id, name: p.name, pos: p.pos, ovr: p.ovr, apps: live ? live.apps : 0, goals: live ? live.goals : 0, motm: live ? live.motm : 0 };
      })
      .sort((a, b) => b.goals - a.goals || b.motm - a.motm || a.name.localeCompare(b.name, 'ru'));
  }, [db.players, replaceQuery, result.list]);

  return (
    <div className="space-y-4">
      <div className="flex flex-wrap items-end justify-between gap-3">
        <div className="min-w-0">
          <div className="text-xs font-semibold uppercase tracking-wider text-mute">Лучший игрок сезона</div>
          <h2 className="font-display text-4xl font-extrabold uppercase leading-none mt-1">Золотой мяч</h2>
        </div>
        <div className="min-w-0 basis-40">
          <label className={labelCls} htmlFor="bd-season">Сезон</label>
          <select id="bd-season" className={inputCls} value={season} onChange={(e) => setSeason(Number(e.target.value))}>
            {seasons.map((s) => <option key={s} value={s}>{s}</option>)}
          </select>
        </div>
      </div>

      {!winner ? (
        <Panel><Empty>В сезоне {season} ещё нет сыгранных матчей.</Empty></Panel>
      ) : (
        <>
          <div className="bg-navy text-navyink rounded p-4 sm:p-6 view-in" style={{ borderBottom: '3px solid var(--yellow)' }}>
            <div className="flex flex-wrap items-center gap-4 sm:gap-6">
              <div className="min-w-0 flex-1 basis-64">
                <div className="text-xs uppercase tracking-wider opacity-80">{running ? `Лидер гонки · сезон ${season} идёт` : `Победитель · сезон ${season}`}</div>
                <div className="font-display text-4xl sm:text-5xl font-extrabold uppercase leading-none break-words mt-1"><PlayerLink id={winner.id} name={winner.name} className="!text-navyink" /></div>
                <div className="flex items-center gap-2 mt-3 text-sm">
                  {winner.lastClubId && <ClubLogo id={winner.lastClubId} name={winner.lastClubName} size={28} />}
                  <span>{winner.lastClubName}</span><span className="opacity-70">· {POS_NAME[winner.pos]}</span>
                </div>
                {award && (
                  <div className="inline-block mt-3 rounded-sm px-2 py-0.5 text-xs font-bold uppercase tracking-wider" style={{ background: 'var(--yellow)', color: '#0A1233' }}>
                    Награда вручена{award.playerId !== winner.id ? `: ${award.name}` : ''}
                  </div>
                )}
              </div>
              <div className="text-center border rounded px-5 py-3" style={{ borderColor: 'rgba(255,255,255,0.35)' }}>
                <div className="font-display text-5xl font-extrabold num leading-none">{winner.total.toFixed(1)}</div>
                <div className="text-[11px] uppercase tracking-wider opacity-80 mt-1">очков из 100</div>
              </div>
            </div>
            <div className="mt-4 flex flex-wrap items-center gap-3">
              <button type="button" className="rounded px-3.5 py-2 text-sm font-semibold transition-all duration-150 active:scale-[0.98] focus:outline-none focus-visible:ring-2 focus-visible:ring-cyan" style={{ background: 'var(--yellow)', color: '#0A1233' }} onClick={give}>
                {award ? 'Обновить результат' : `Вручить Золотой мяч ${season}`}
              </button>
              {manualWinner && <button type="button" className="btn-navy rounded px-3 py-2 text-sm font-semibold" onClick={() => setManualWinner(null)}>Сбросить ручной выбор</button>}
              <span className="text-xs opacity-80">Формула: статистика 40% · трофеи 30% · импакт 30%. OVR не учитывается.</span>
            </div>
            {msg && <p className="text-sm mt-2">{msg}</p>}
          </div>

          <Panel>
            <Heading className="mb-1">Пять номинантов</Heading>
            <p className="text-sm text-mute mb-4">В списке игроки, сыгравшие не меньше {result.minApps} {plural(result.minApps, ['матча', 'матчей', 'матчей'])} в сезоне. Меняй порядок стрелками, заменяй номинантов и утверждай победителя вручную.</p>
            <ol className="space-y-3">
              {nominees.map((r, i) => (
                <li key={r.id} className="border border-line rounded bg-surf p-4 view-in" style={{ animationDelay: `${i * 50}ms` }}>
                  <div className="flex flex-wrap items-start gap-4">
                    <div className="flex flex-col items-center gap-1">
                      <div className="font-display text-5xl font-extrabold num leading-none" style={{ opacity: 0.35 }}>{i + 1}</div>
                      <div className="flex flex-col gap-1">
                        <button type="button" className="rounded border border-line bg-surf2 px-1.5 py-0.5 text-xs hover:bg-surf disabled:opacity-30" disabled={i === 0} onClick={() => moveUp(i)} aria-label="Выше">▲</button>
                        <button type="button" className="rounded border border-line bg-surf2 px-1.5 py-0.5 text-xs hover:bg-surf disabled:opacity-30" disabled={i === nominees.length - 1} onClick={() => moveDown(i)} aria-label="Ниже">▼</button>
                      </div>
                    </div>
                    <div className="min-w-0 flex-1 basis-56">
                      <div className="font-display text-2xl font-bold uppercase break-words"><PlayerLink id={r.id} name={r.name} /></div>
                      <div className="flex flex-wrap items-center gap-2 text-sm text-mute mt-1">
                        <PosChip pos={r.pos} />
                        {r.lastClubId && <ClubLogo id={r.lastClubId} name={r.lastClubName} size={22} />}
                        <span>{r.lastClubName}</span>
                      </div>
                      <div className="grid grid-cols-3 sm:grid-cols-7 gap-3 mt-3">
                        <Metric label="Матчи" value={r.apps} /><Metric label="Голы" value={r.goals} /><Metric label="MVP" value={r.motm} />
                        <Metric label="Хет-трики" value={r.hatTricks} /><Metric label="Покеры" value={r.pokers} />
                        <Metric label="5+" value={r.fivePlus} /><Metric label="Трофеи" value={r.titles} />
                      </div>
                    </div>
                    <div className="text-right flex flex-col items-end gap-2">
                      <div>
                        <div className="font-display text-4xl font-bold num leading-none">{r.total.toFixed(1)}</div>
                        <div className="text-[11px] uppercase tracking-wider text-mute mt-1">из 100</div>
                      </div>
                      <div className="flex flex-col gap-1">
                        <button type="button" className={btn('ghost', 'sm')} onClick={() => openReplace(i)}>Заменить</button>
                        <button type="button" className={btn(manualWinner === r.id ? 'primary' : 'ghost', 'sm')} onClick={() => setManualWinner(r.id)}>
                          {manualWinner === r.id ? 'Выбран' : 'Выбрать'}
                        </button>
                      </div>
                    </div>
                  </div>
                  <div className="grid sm:grid-cols-3 gap-x-6 gap-y-3 mt-4 pt-4 border-t border-line">
                    {BALLON_PARTS.map(([key, label, weight]) => (
                      <div key={key} className="min-w-0">
                        <div className="flex items-baseline justify-between gap-2 text-xs">
                          <span className="font-semibold uppercase tracking-wider text-mute">{label} · {weight}%</span>
                          <span className="num font-semibold">{(r.parts[key] * weight).toFixed(1)} из {weight}</span>
                        </div>
                        <div className="h-1.5 rounded-sm mt-1" style={{ background: 'var(--line)' }}>
                          <div className="h-full rounded-sm" style={{ width: `${Math.round(r.parts[key] * 100)}%`, background: 'var(--acc)', transition: 'width 500ms ease' }} />

          </Panel>

          <Panel>
            <Heading className="mb-3">Как выбирается победитель</Heading>
            <ul className="divide-y divide-line border border-line rounded">

                <li key={key} className="px-3 py-2 text-sm">
                  <div className="flex items-baseline justify-between gap-2"><span className="font-semibold">{label}</span><span className="num font-bold">{weight}%</span></div>
                  <div className="text-xs text-mute mt-0.5">{text}</div>

              ))}

            <p className="text-xs text-mute mt-3">OVR и клубный престиж в формуле не участвуют.</p>

      {replaceIdx !== null && (
        <div className="modal-back" onClick={() => setReplaceIdx(null)} role="dialog" aria-modal="true" aria-label="Замена номинанта">
          <div className="modal-panel max-w-xl" onClick={(e) => e.stopPropagation()}>
            <div className="bg-navy text-navyink p-4 flex items-center justify-between gap-3">
              <h2 className="font-display text-2xl font-bold uppercase tracking-wider">Заменить номинанта</h2>
              <button type="button" onClick={() => setReplaceIdx(null)} className="btn-navy rounded px-2.5 py-1 text-xs font-semibold">Закрыть</button>
            </div>
            <div className="p-4">
              <input className={inputCls} placeholder="Поиск игрока" value={replaceQuery} onChange={(e) => setReplaceQuery(e.target.value)} />
              <ul className="mt-3 max-h-80 overflow-y-auto divide-y divide-line border border-line rounded">
                {allPlayersForReplace.length === 0 && <li><Empty>Игроки не найдены.</Empty></li>}
                {allPlayersForReplace.map((p) => (
                  <li key={p.id}>
                    <button type="button" className="w-full text-left px-3 py-2 hover:bg-surf2 flex items-center gap-3" onClick={() => doReplace(p.id)}>
                      <PosChip pos={p.pos} />
                      <span className="min-w-0 flex-1 break-words">{p.name}</span>
                      <span className="text-xs text-mute num">{p.apps} М · {p.goals} Г · {p.motm} MVP · OVR {p.ovr}</span>
                    </button>
                  </li>
                ))}
              </ul>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

function TournamentLeaders({ matches, tid }) {
  const rows = useMemo(() => Object.values(aggregateMatches(matches, (m) => m.tournamentId === tid)), [matches, tid]);
  const top = (valueOf, min) => rows.filter((r) => r.s.apps >= min && valueOf(r) > 0).sort((a, b) => valueOf(b) - valueOf(a)).slice(0, 5);
  const lists = [
    ['Бомбардиры', top((r) => r.s.goals, 1), (r) => r.s.goals],
    ['MVP', top((r) => r.s.motm, 1), (r) => r.s.motm],
    ['Хет-трики', top((r) => r.s.hatTricks + r.s.pokers + r.s.fivePlus, 1), (r) => r.s.hatTricks + r.s.pokers + r.s.fivePlus]
  ];
  return (
    <Panel>
      <Heading className="mb-3">Лучшие в турнире</Heading>
      <div className="grid md:grid-cols-3 gap-4">
        {lists.map(([title, list, valueOf]) => (
          <div key={title} className="min-w-0">
            <div className="text-[11px] font-semibold uppercase tracking-wider text-mute mb-2">{title}</div>
            {list.length === 0 ? <p className="text-sm text-mute">Пока нет данных</p> : (
              <ol className="divide-y divide-line border border-line rounded">
                {list.map((r, i) => (
                  <li key={r.id} className="px-3 py-2 flex items-center gap-2 text-sm">
                    <span className="text-mute num w-4">{i + 1}</span>
                    <span className="min-w-0 flex-1 break-words"><PlayerLink id={r.id} name={r.name} /><span className="block text-xs text-mute">{r.clubName}</span></span>
                    <span className="font-display text-xl font-bold num">{valueOf(r)}</span>
                  </li>
                ))}
              </ol>
            )}
          </div>
        ))}
      </div>
    </Panel>
  );
}

function ScheduleEditor({ tour, edition, onClose, onSave }) {
  const [fixtures, setFixtures] = useState([...edition.fixtures]);
  
  const updateFixture = (idx, field, value) => {
    const next = [...fixtures];
    next[idx] = { ...next[idx], [field]: value };
    setFixtures(next);
  };

  const addMatch = () => {
    const lastRound = fixtures.length ? fixtures[fixtures.length - 1].round : 0;
    setFixtures([...fixtures, { id: uid(), round: lastRound + 1, home: '', away: '', played: false, hg: null, ag: null, events: [], matchId: null }]);
  };

  const removeMatch = (idx) => setFixtures(fixtures.filter((_, i) => i !== idx));
  
  const grouped = useMemo(() => {
    const map = new Map();
    fixtures.forEach((f, i) => {
      if (!map.has(f.round)) map.set(f.round, []);
      map.get(f.round).push({ ...f, _idx: i });
    });
    return [...map.entries()].sort((a, b) => a[0] - b[0]);
  }, [fixtures]);

  return (
    <div className="modal-back" onClick={onClose} role="dialog" aria-modal="true">
      <div className="modal-panel max-w-2xl" onClick={(e) => e.stopPropagation()}>
        <div className="bg-navy text-navyink p-4 flex items-center justify-between gap-3">
          <h2 className="font-display text-2xl font-bold uppercase tracking-wider">Редактор расписания</h2>
          <button type="button" onClick={onClose} className="btn-navy rounded px-2.5 py-1 text-xs font-semibold">Закрыть</button>
        </div>
        <div className="p-4 space-y-4 max-h-[80vh] overflow-y-auto">
          {grouped.map(([round, list]) => (
            <div key={round} className="border border-line rounded p-3">
              <div className="font-display font-bold text-lg mb-2">Тур {round}</div>
              <ul className="space-y-2">
                {list.map((f) => (
                  <li key={f.id} className="flex flex-wrap items-center gap-2">
                    <select className={inputCls + ' !w-36'} value={f.home} onChange={(e) => updateFixture(f._idx, 'home', e.target.value)}>
                      <option value="">Выберите хозяев</option>
                      {edition.teams.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
                    </select>
                    <span className="font-bold">:</span>
                    <select className={inputCls + ' !w-36'} value={f.away} onChange={(e) => updateFixture(f._idx, 'away', e.target.value)}>
                      <option value="">Выберите гостей</option>
                      {edition.teams.map((t) => <option key={t.id} value={t.id}>{t.name}</option>)}
                    </select>
                    <span className="text-xs text-mute">Тур</span>
                    <input type="number" className={inputCls + ' !w-16'} value={f.round} onChange={(e) => updateFixture(f._idx, 'round', Number(e.target.value))} />
                    <button type="button" className="text-bad text-xs hover:underline" onClick={() => removeMatch(f._idx)}>Удалить</button>
                  </li>
                ))}
              </ul>
            </div>
          ))}
          <div className="flex gap-2 pt-2">
            <button type="button" className={btn('ghost')} onClick={addMatch}>+ Добавить матч</button>
            <button type="button" className={btn('primary')} onClick={() => onSave(fixtures)}>Сохранить расписание</button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ManualMatchEditor({ tour, edition, fixture, db, onClose, onSave }) {
  const [matchId, setMatchId] = useState(fixture.matchId);
  
  if (!matchId) {
    const homeName = teamName(edition, fixture.home);
    const awayName = teamName(edition, fixture.away);
    const homeSquad = edition.national ? db.players.filter(p => p.countryId === fixture.home && !p.retired) : squadOf(db.players, fixture.home);
    const awaySquad = edition.national ? db.players.filter(p => p.countryId === fixture.away && !p.retired) : squadOf(db.players, fixture.away);
    
    const createEmptyMatch = (hg, ag) => {
      const homeGoals = Math.max(0, Number(hg) || 0);
      const awayGoals = Math.max(0, Number(ag) || 0);
      
      const events = [];
      for(let i=0; i<homeGoals; i++) events.push({min: 10, type: 'goal', side: 'home', playerId: homeSquad[0]?.id || '', name: homeSquad[0]?.name || 'Игрок'});
      for(let i=0; i<awayGoals; i++) events.push({min: 20, type: 'goal', side: 'away', playerId: awaySquad[0]?.id || '', name: awaySquad[0]?.name || 'Игрок'});
      
      const lineups = {
        home: homeSquad.map(p => ({id: p.id, name: p.name, pos: p.pos, number: p.number, ovr: p.ovr, clubId: fixture.home, goals: 0})),
        away: awaySquad.map(p => ({id: p.id, name: p.name, pos: p.pos, number: p.number, ovr: p.ovr, clubId: fixture.away, goals: 0}))
      };
      if (lineups.home[0]) lineups.home[0].goals = homeGoals;
      if (lineups.away[0]) lineups.away[0].goals = awayGoals;
      
      const newMatch = {
        id: uid(), season: edition.season, tournamentId: tour.id, editionId: edition.id,
        tournamentName: tour.name, tType: tour.type, stage: `Тур ${fixture.round}`, national: !!edition.national,
        homeId: fixture.home, awayId: fixture.away, homeName, awayName,
        hg: homeGoals, ag: awayGoals, pens: null, events, lineups,
        motmId: homeSquad[0]?.id || null, stats: { possession: [50,50], shots: [10,10], onTarget: [5,5] }, ts: Date.now()
      };
      onSave(newMatch, fixture.id);
    };

    return (
      <div className="modal-back" onClick={onClose} role="dialog">
        <div className="modal-panel max-w-md" onClick={(e) => e.stopPropagation()}>
           <div className="bg-navy text-navyink p-4 flex items-center justify-between">
              <h2 className="font-display text-2xl font-bold uppercase">Ручной ввод</h2>
              <button type="button" onClick={onClose} className="btn-navy rounded px-2.5 py-1 text-xs">Закрыть</button>
           </div>
           <div className="p-4 space-y-4">
             <p className="text-sm font-semibold">{homeName} : {awayName}</p>
             <div className="flex gap-2">
                <button type="button" className={btn('primary')} onClick={() => createEmptyMatch(0,0)}>0 : 0</button>
                <button type="button" className={btn('primary')} onClick={() => createEmptyMatch(1,0)}>1 : 0</button>
                <button type="button" className={btn('primary')} onClick={() => createEmptyMatch(2,1)}>2 : 1</button>
                <button type="button" className={btn('primary')} onClick={() => createEmptyMatch(3,2)}>3 : 2</button>
             </div>
             <p className="text-xs text-mute">Создаётся базовый матч со счётом. Детали (кто забил, минуты) можно отредактировать в Центре матча.</p>
           </div>
        </div>
      </div>
    );
  }
  return null;
}
